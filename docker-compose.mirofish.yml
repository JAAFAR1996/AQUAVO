version: "3.9"

# =====================================================================
# MiroFish Sidecar — AQUAVO Integration
# =====================================================================
# يبني MiroFish مباشرة من GitHub ويشغّله كخدمة مساعدة لـ AQUAVO
#
# الاستخدام:
#   docker-compose -f docker-compose.mirofish.yml up -d --build
#
# المتطلبات:
#   - GROQ_API_KEY في ملف .env
#   - ZEP_API_KEY في ملف .env (من https://www.getzep.com — مجاني)
#   - Docker Desktop مشغّل
#
# بعد التشغيل:
#   - MiroFish API متاح على: http://localhost:5001
#   - تحقق من الحالة: curl http://localhost:5001/health
# =====================================================================

services:

  mirofish:
    build:
      context: ./mirofish-app        # يحتوي على Dockerfile فقط
      dockerfile: Dockerfile          # يسحب كود MiroFish من GitHub تلقائياً
    container_name: aquavo_mirofish
    ports:
      - "5001:5001"
    environment:
      # LLM — Groq هو OpenAI-compatible ← لا حاجة لمفتاح جديد
      LLM_API_KEY: ${GROQ_API_KEY}
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LLM_MODEL_NAME: llama-3.3-70b-versatile

      # Zep Cloud — ذاكرة الوكلاء
      ZEP_API_KEY: ${ZEP_API_KEY}

      # إعدادات Flask
      FLASK_ENV: production
      PORT: 5001

    volumes:
      - mirofish_data:/app/data       # احتفظ ببيانات المحاكاة بين إعادات التشغيل

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s              # وقت كافٍ لاكتمال تثبيت المكتبات أول مرة

volumes:
  mirofish_data:
    driver: local
