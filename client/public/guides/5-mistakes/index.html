<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5 أخطاء شائعة في أحواض الزينة | AQUAVO</title>
  <meta name="description" content="دليل AQUAVO: 5 أخطاء شائعة يرتكبها هواة أحواض الزينة في العراق وكيف تتجنبها." />
  <link rel="icon" type="image/png" sizes="512x512" href="/brand/aquavo-v2-favicon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0B1E28;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: rgba(1,6,17,0.96);
      border-bottom: 1px solid rgba(11,147,166,0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    #logo {
      color: #0B93A6;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 4px;
      text-decoration: none;
    }
    #btns { display: flex; gap: 10px; align-items: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .btn:hover { opacity: 0.85; }
    .btn-outline {
      background: transparent;
      color: #E8EDF2;
      border: 1px solid rgba(11,147,166,0.4);
    }
    .btn-solid {
      background: #0B93A6;
      color: #0B1E28;
    }
    #viewer {
      position: fixed;
      top: 56px; left: 0; right: 0; bottom: 0;
    }
    #viewer iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #0B1E28;
    }
    #fallback {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      color: #8899aa;
      font-size: 15px;
      text-align: center;
      padding: 24px;
    }
    #fallback a {
      color: #0B93A6;
      font-weight: 700;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header id="topbar">
    <a id="logo" href="/">AQUAVO</a>
    <div id="btns">
      <a id="btn-open" class="btn btn-outline" target="_blank" rel="noopener noreferrer">
        فتح بصفحة كاملة
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
      <a id="btn-dl" class="btn btn-solid" download>
        تحميل PDF
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </a>
    </div>
  </header>

  <div id="viewer">
    <iframe id="pdfframe" title="دليل الأخطاء الخمسة الشائعة بالأحواض" loading="eager" allowfullscreen></iframe>
    <div id="fallback">
      <p>إذا ما ظهر الدليل، اضغط للتحميل المباشر:</p>
      <a id="fallback-link">تحميل PDF</a>
    </div>
  </div>

  <script>
    var pdf = "/assets/guides/aquavo-guide-5-mistakes.pdf";
    document.getElementById("pdfframe").src = pdf + "#toolbar=1&navpanes=0&scrollbar=1&view=FitH";
    document.getElementById("btn-open").href = pdf;
    document.getElementById("btn-dl").href = pdf;
    document.getElementById("fallback-link").href = pdf;

    // Show fallback if iframe fails
    document.getElementById("pdfframe").onerror = function() {
      document.getElementById("fallback").style.display = "flex";
    };
  </script>
</body>
</html>
