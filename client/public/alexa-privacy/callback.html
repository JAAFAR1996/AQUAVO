<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
  />
  <title>AQUAVO Home AI — Authorization</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1e28; color: #f6f4ef; }
    main { width: min(92vw, 560px); padding: 32px; text-align: center; border: 1px solid rgba(255,255,255,.14); border-radius: 18px; background: rgba(255,255,255,.06); }
    h1 { margin: 0 0 12px; font-size: 1.4rem; }
    p { margin: 8px 0; line-height: 1.6; opacity: .86; }
    .ok { color: #8de1eb; }
    .err { color: #ffb4b4; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Completing Amazon authorization…</h1>
    <p id="status">Return to the setup window when this finishes.</p>
    <p dir="rtl">جارٍ إكمال ربط Amazon. ارجع إلى نافذة الإعداد بعد اكتمال العملية.</p>
  </main>

  <script>
    (() => {
      "use strict";

      // This page is intentionally standalone: no AQUAVO app bundle, analytics,
      // pixels, storage, API calls, or device-control code are loaded here.
      const SETUP_ORIGIN = "http://127.0.0.1:8945";
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const state = params.get("state");
      const error = params.get("error");

      // Remove OAuth parameters from the visible address bar immediately.
      try {
        window.history.replaceState(null, "", window.location.pathname);
      } catch (_) {}

      const title = document.getElementById("title");
      const status = document.getElementById("status");

      if (!window.opener || window.opener.closed) {
        title.textContent = "Authorization window not connected";
        title.className = "err";
        status.textContent = "Return to the setup tool and restart the authorization flow.";
        return;
      }

      // State is validated by the local setup tool that generated it.
      // This bridge only relays the short-lived authorization result to that opener.
      window.opener.postMessage(
        {
          type: "aquavo-alexa-oauth-callback",
          code: code || null,
          state: state || null,
          error: error || null
        },
        SETUP_ORIGIN
      );

      if (error || !code || !state) {
        title.textContent = "Amazon authorization was not completed";
        title.className = "err";
        status.textContent = "Return to the setup window for details.";
        return;
      }

      title.textContent = "Authorization received";
      title.className = "ok";
      status.textContent = "You can return to the setup window. This window may close automatically.";

      window.setTimeout(() => {
        try { window.close(); } catch (_) {}
      }, 500);
    })();
  </script>
</body>
</html>
