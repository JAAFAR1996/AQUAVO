<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
  />
  <title>AQUAVO Home AI — Authorization</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1e28; color: #f6f4ef; }
    main { width: min(92vw, 560px); padding: 32px; text-align: center; border: 1px solid rgba(255,255,255,.14); border-radius: 18px; background: rgba(255,255,255,.06); }
    h1 { margin: 0 0 12px; font-size: 1.4rem; }
    p { margin: 8px 0; line-height: 1.6; opacity: .86; }
    .ok { color: #8de1eb; }
    .err { color: #ffb4b4; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Completing Amazon authorization…</h1>
    <p id="status">Returning authorization to the local setup tool.</p>
    <p dir="rtl">جارٍ إكمال ربط Amazon وإرجاع النتيجة إلى أداة الإعداد المحلية.</p>
  </main>

  <script>
    (() => {
      "use strict";

      // Standalone OAuth bridge only: no AQUAVO app bundle, analytics, storage,
      // API calls, or device-control code are loaded here.
      const LOCAL_CALLBACK = "http://127.0.0.1:8945/oauth/callback";
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const state = params.get("state");
      const error = params.get("error");

      const title = document.getElementById("title");
      const status = document.getElementById("status");

      if (!code && !error) {
        title.textContent = "Amazon authorization was not completed";
        title.className = "err";
        status.textContent = "No authorization result was returned.";
        return;
      }

      const out = new URLSearchParams();
      if (code) out.set("code", code);
      if (state) out.set("state", state);
      if (error) out.set("error", error);

      // State validation and token handling occur only in the local setup tool.
      // This page only forwards the short-lived OAuth result in the same browser tab,
      // so it does not depend on window.opener or popup behavior.
      title.textContent = "Authorization received";
      title.className = "ok";
      status.textContent = "Returning to the local setup tool…";

      window.location.replace(LOCAL_CALLBACK + "?" + out.toString());
    })();
  </script>
</body>
</html>
