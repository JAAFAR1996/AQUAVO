    }

    body {
      font-family: 'Cairo', sans-serif;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      margin: 0
    }
    
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Changa', sans-serif;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .hero-section {
      position: relative;
      height: 700px;
      width: 100%;
      overflow: hidden
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent, hsl(var(--background)));
      z-index: 10
    }
