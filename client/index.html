<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes" />

  <!-- Theme bootstrap (runs before first paint — prevents flash + sets first-visit default).
       First-time visitors (no saved preference) default to AQUAVO Dark Authority.
       A returning visitor's explicit choice (light/dark/system) is read from localStorage and respected. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        var resolved;
        if (t === 'dark') resolved = 'dark';
        else if (t === 'light') resolved = 'light';
        else if (t === 'system') resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        else resolved = 'dark'; /* first-time visitor default */
        var el = document.documentElement;
        el.classList.remove('dark', 'light');
        el.classList.add(resolved);
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <title>__META_TITLE__</title>
  <meta name="description" content="__META_DESCRIPTION__" />
  <meta name="keywords" content="__META_KEYWORDS__" />
  <link rel="canonical" href="__META_URL__" />

  <!-- Preload LCP hero image for fastest possible render (responsive) -->
  <link rel="preload" fetchpriority="high" as="image" type="image/webp"
    href="/images/aquascape-styles/iwagumi_aquascape_1765676307763.webp"
    imagesrcset="/images/aquascape-styles/iwagumi_aquascape_1765676307763-640.webp 640w, /images/aquascape-styles/iwagumi_aquascape_1765676307763.webp 1024w"
    imagesizes="(max-width: 1024px) 100vw, 48vw" />

  <!-- Open Graph / Facebook -->
  <meta property="og:title" content="__META_TITLE__" />
  <meta property="og:description" content="__META_DESCRIPTION__" />
  <meta property="og:type" content="__META_OG_TYPE__" />
  <meta property="og:url" content="__META_URL__" />
  <meta property="og:site_name" content="AQUAVO" />
  <meta property="og:locale" content="ar_IQ" />
  <meta property="og:image" content="__META_IMAGE__" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@aquavoiq" />
  <meta name="twitter:title" content="__META_TITLE__" />
  <meta name="twitter:description" content="__META_DESCRIPTION__" />
  <meta name="twitter:image" content="__META_IMAGE__" />

  <!-- SSR JSON-LD -->
  <!--__JSON_LD__-->

  <!-- Approved AQUAVO v2 favicon -->
  <link rel="icon" type="image/png" sizes="512x512" href="/brand/aquavo-v2-favicon.png" />
  <link rel="apple-touch-icon" href="/brand/aquavo-v2-favicon.png" />
  <meta name="theme-color" content="#0B93A6" />

  <!-- PWA Support - 2025 Standard -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AQUAVO" />

  <!-- Performance: only preconnect to origins needed for initial render -->
  <!-- Removed: unsplash (unused), fist-live-server (same-origin), plausible/tiktok (deferred 3.5s) -->
  <meta name="robots" content="index, follow, max-image-preview:large">

  <!-- Preconnect for Google Fonts (DNS + TLS resolved before fonts load) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Hero image preload only when on home page (handled by React) -->

  <!-- Approved v2 type system: Cairo Arabic, Inter interface/English, Changa display only -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;700&family=Changa:wght@700&display=swap">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;700&family=Changa:wght@700&display=swap" rel="stylesheet">
  </noscript>

  <!-- Critical CSS for Above-the-Fold Content -->
  <style>
    :root {
      --background: 201 57% 10%;
      --foreground: 0 0% 100%;
      --primary: 187 88% 35%;
      --primary-foreground: 0 0% 100%;
      --accent: 205 88% 35%;
    }

    body {
      font-family: 'Cairo', Tahoma, sans-serif;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      margin: 0
    }
    
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Cairo', Tahoma, sans-serif;
      font-weight: 700;
      letter-spacing: 0;
    }

    .hero-section {
      position: relative;
      height: 700px;
      width: 100%;
      overflow: hidden
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent, hsl(var(--background)));
      z-index: 10
    }

  </style>

</head>

<body dir="rtl">
  <div id="root" dir="rtl"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>


</html>
