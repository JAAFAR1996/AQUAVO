<head>

  <meta property="og:title" content="__META_TITLE__" />

  <meta name="twitter:card" content="summary_large_image" />

  <meta name="twitter:title" content="__META_TITLE__" />

  <!-- SSR JSON-LD -->
  __JSON_LD__

  <!-- Favicons - AQUAVO Logo -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="shortcut icon" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#199bb8" />

  <!-- PWA Support - 2025 Standard -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AQUAVO" />

  <!-- Performance: only preconnect to origins needed for initial render -->
  <!-- Removed: unsplash (unused), fist-live-server (same-origin), plausible/tiktok (deferred 3.5s) -->
  <meta name="robots" content="index, follow, max-image-preview:large">

  <!-- Preload LCP image (hero poster) for fastest paint -->
  <link rel="preload" as="image" type="image/webp" href="/images/aquascape-styles/iwagumi_aquascape_1765676307763.webp" fetchpriority="high">

  <!-- Fonts: defer brand webfonts so first paint uses system fallback instead of blocking LCP -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap&subset=arabic" media="print" data-deferred-font>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Changa:wght@700;900&family=Outfit:wght@600;700;800&display=swap&subset=arabic" media="print" data-deferred-font>
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Changa:wght@700;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  </noscript>

  <!-- Critical CSS for Above-the-Fold Content -->
  <style>
    :root {
      /* Deep Navy Background - AQUAVO Brand */
      --background: 222 47% 6%;
      --foreground: 210 40% 98%;
      /* AQUAVO Brand Primary: #199bb8 */
      --primary: 194 76% 41%;
      --primary-foreground: 0 0% 100%;
      /* AQUAVO Accent: #ff7b5a */
      --accent: 12 100% 67%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      margin: 0
    }
    
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Changa', sans-serif;
      font-weight: 800;
      letter-spacing: 0;
    }

    .hero-section {
      position: relative;
      height: 700px;
      width: 100%;
      overflow: hidden
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent, hsl(var(--background)));
      z-index: 10
    }

    .critical-home-shell {
      position: absolute;
      inset: 0;
      min-height: 100vh;
      z-index: 30;
      pointer-events: none;
      box-sizing: border-box;
      padding: 96px 16px 48px;
      background: hsl(var(--background));
      animation: critical-shell-hide .3s linear 2000ms forwards
    }

    .critical-home-card {
      position: relative;
      height: min(400px, calc(100vh - 144px));
      min-height: 320px;
      overflow: hidden;
      border-radius: 24px;
      background: #000
    }

    .critical-home-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .critical-home-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.1), rgba(0,0,0,.62))
    }

    .critical-home-copy {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
      padding: 32px;
      color: #fff;
      text-align: right
    }

    .critical-home-copy h1 {
      margin: 0;
      max-width: 720px;
      margin-left: auto;
      font-size: clamp(2.4rem, 12vw, 4.5rem);
      line-height: 1.04
    }

    @media (min-width: 768px) {
      .critical-home-card {
        min-height: 500px
      }
    }

    @keyframes critical-shell-hide {
      to {
        opacity: 0;
        visibility: hidden
      }
    }
  </style>

</head>

<body>
  <!-- Loading skeleton that matches the Bento Grid layout — hidden after React mounts -->
  <div id="loading-shell" style="
    position:fixed;inset:0;z-index:9999;
    background:hsl(222,47%,6%);
    padding:64px 16px 16px;
    box-sizing:border-box;
    animation: shell-out 0.4s ease-out 2200ms forwards;
    pointer-events:none;
  ">
    <style>
      @keyframes shell-out {
        to { opacity:0; visibility:hidden; }
      }
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .sk {
        background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.04) 100%);
        background-size: 200% 100%;
        animation: shimmer 1.8s infinite linear;
        border-radius: 16px;
      }
    </style>
    <!-- Navbar skeleton -->
    <div style="position:absolute;top:0;left:0;right:0;height:56px;background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;padding:0 24px;gap:12px;justify-content:space-between;">
      <div class="sk" style="width:90px;height:28px;border-radius:8px;"></div>
      <div style="display:flex;gap:20px;">
        <div class="sk" style="width:48px;height:16px;border-radius:6px;"></div>
        <div class="sk" style="width:56px;height:16px;border-radius:6px;"></div>
        <div class="sk" style="width:44px;height:16px;border-radius:6px;"></div>
        <div class="sk" style="width:52px;height:16px;border-radius:6px;"></div>
      </div>
      <div style="display:flex;gap:10px;">
        <div class="sk" style="width:32px;height:32px;border-radius:50%;"></div>
        <div class="sk" style="width:32px;height:32px;border-radius:50%;"></div>
      </div>
    </div>
    <!-- Bento Grid skeleton -->
    <div style="display:grid;grid-template-columns:1fr;gap:12px;max-width:1280px;margin:0 auto;">
      <!-- Hero + sidebar row -->
      <div style="display:grid;grid-template-columns:2fr 1fr;gap:12px;">
        <!-- Hero card -->
        <div class="sk" style="height:min(320px,55vw);min-height:200px;border-radius:20px;overflow:hidden;position:relative;">
          <img src="/images/aquascape-styles/iwagumi_aquascape_1765676307763.webp" alt="" style="width:100%;height:100%;object-fit:cover;opacity:0.6;" fetchpriority="high" />
          <div style="position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(9,15,35,0.85));"></div>
          <div style="position:absolute;bottom:20px;right:20px;text-align:right;">
            <div class="sk" style="width:90px;height:22px;border-radius:20px;margin-bottom:10px;margin-right:auto;margin-left:0;"></div>
            <div class="sk" style="width:180px;height:32px;border-radius:8px;margin-bottom:8px;margin-right:auto;margin-left:0;"></div>
            <div class="sk" style="width:120px;height:22px;border-radius:8px;margin-right:auto;margin-left:0;"></div>
          </div>
        </div>
        <!-- Best sellers sidebar -->
        <div class="sk" style="border-radius:24px;padding:20px;background:rgba(255,255,255,0.03);display:flex;flex-direction:column;gap:14px;">
          <div class="sk" style="width:120px;height:20px;border-radius:6px;align-self:flex-end;"></div>
          <div style="display:flex;flex-direction:column;gap:12px;flex:1;">
            <div style="display:flex;gap:10px;align-items:center;"><div class="sk" style="width:48px;height:48px;border-radius:10px;flex-shrink:0;"></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;"><div class="sk" style="height:12px;width:90%;border-radius:4px;"></div><div class="sk" style="height:10px;width:40%;border-radius:4px;"></div></div></div>
            <div style="display:flex;gap:10px;align-items:center;"><div class="sk" style="width:48px;height:48px;border-radius:10px;flex-shrink:0;"></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;"><div class="sk" style="height:12px;width:85%;border-radius:4px;"></div><div class="sk" style="height:10px;width:35%;border-radius:4px;"></div></div></div>
            <div style="display:flex;gap:10px;align-items:center;"><div class="sk" style="width:48px;height:48px;border-radius:10px;flex-shrink:0;"></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;"><div class="sk" style="height:12px;width:75%;border-radius:4px;"></div><div class="sk" style="height:10px;width:30%;border-radius:4px;"></div></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>


</html>
