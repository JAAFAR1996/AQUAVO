<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes" />
  <title>__META_TITLE__</title>
  <meta name="description" content="__META_DESCRIPTION__" />
  <meta name="keywords" content="__META_KEYWORDS__" />
  <link rel="canonical" href="__META_URL__" />

  <!-- Preload LCP hero image for fastest possible render (responsive) -->
  <link rel="preload" fetchpriority="high" as="image" type="image/webp"
    href="/images/aquascape-styles/iwagumi_aquascape_1765676307763.webp"
    imagesrcset="/images/aquascape-styles/iwagumi_aquascape_1765676307763-640.webp 640w, /images/aquascape-styles/iwagumi_aquascape_1765676307763.webp 1024w"
    imagesizes="(max-width: 1024px) 100vw, 66vw" />

  <!-- Open Graph / Facebook -->
  <meta property="og:title" content="__META_TITLE__" />
  <meta property="og:description" content="__META_DESCRIPTION__" />
  <meta property="og:type" content="__META_OG_TYPE__" />
  <meta property="og:url" content="__META_URL__" />
  <meta property="og:site_name" content="AQUAVO" />
  <meta property="og:locale" content="ar_IQ" />
  <meta property="og:image" content="__META_IMAGE__" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@aquavoiq" />
  <meta name="twitter:title" content="__META_TITLE__" />
  <meta name="twitter:description" content="__META_DESCRIPTION__" />
  <meta name="twitter:image" content="__META_IMAGE__" />

  <!-- SSR JSON-LD -->
  __JSON_LD__

  <!-- Favicons - AQUAVO Logo -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="shortcut icon" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#199bb8" />

  <!-- PWA Support - 2025 Standard -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AQUAVO" />

  <!-- Performance: only preconnect to origins needed for initial render -->
  <!-- Removed: unsplash (unused), fist-live-server (same-origin), plausible/tiktok (deferred 3.5s) -->
  <meta name="robots" content="index, follow, max-image-preview:large">

  <!-- Hero image preload only when on home page (handled by React) -->

  <!-- Fonts: defer brand webfonts so first paint uses system fallback instead of blocking LCP -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap&subset=arabic" media="print" data-deferred-font>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Changa:wght@700;900&family=Outfit:wght@600;700;800&display=swap&subset=arabic" media="print" data-deferred-font>
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Changa:wght@700;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  </noscript>

  <!-- Critical CSS for Above-the-Fold Content -->
  <style>
    :root {
      /* Deep Navy Background - AQUAVO Brand */
      --background: 222 47% 6%;
      --foreground: 210 40% 98%;
      /* AQUAVO Brand Primary: #199bb8 */
      --primary: 194 76% 41%;
      --primary-foreground: 0 0% 100%;
      /* AQUAVO Accent: #ff7b5a */
      --accent: 12 100% 67%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      margin: 0
    }
    
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Changa', sans-serif;
      font-weight: 800;
      letter-spacing: 0;
    }

    .hero-section {
      position: relative;
      height: 700px;
      width: 100%;
      overflow: hidden
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent, hsl(var(--background)));
      z-index: 10
    }

    .critical-home-shell {
      position: absolute;
      inset: 0;
      min-height: 100vh;
      z-index: 30;
      pointer-events: none;
      box-sizing: border-box;
      padding: 96px 16px 48px;
      background: hsl(var(--background));
      animation: critical-shell-hide .3s linear 1000ms forwards
    }

    .critical-home-card {
      position: relative;
      height: min(400px, calc(100vh - 144px));
      min-height: 320px;
      overflow: hidden;
      border-radius: 24px;
      background: #000
    }

    .critical-home-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .critical-home-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.1), rgba(0,0,0,.62))
    }

    .critical-home-copy {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
      padding: 32px;
      color: #fff;
      text-align: right
    }

    .critical-home-copy h1 {
      margin: 0;
      max-width: 720px;
      margin-left: auto;
      font-size: clamp(2.4rem, 12vw, 4.5rem);
      line-height: 1.04
    }

    @media (min-width: 768px) {
      .critical-home-card {
        min-height: 500px
      }
    }

    @keyframes critical-shell-hide {
      to {
        opacity: 0;
        visibility: hidden
      }
    }
  </style>

</head>

<body dir="rtl">
  <!-- Minimal loading shell — just dark bg + shimmer navbar, no content-specific images -->
  <div id="loading-shell" style="
    position:fixed;inset:0;z-index:9999;
    background:hsl(222,47%,6%);
    box-sizing:border-box;
    animation: shell-out 0.35s ease-out 800ms forwards;
    pointer-events:none;
  ">
    <style>
      @keyframes shell-out { to { opacity:0; visibility:hidden; } }
      @keyframes sk-shimmer {
        0% { background-position: -400px 0; }
        100% { background-position: 400px 0; }
      }
      .sk {
        background: linear-gradient(90deg,
          rgba(255,255,255,0.04) 0%,
          rgba(255,255,255,0.08) 50%,
          rgba(255,255,255,0.04) 100%);
        background-size: 400px 100%;
        animation: sk-shimmer 1.6s infinite linear;
        border-radius: 8px;
      }
    </style>
    <!-- Navbar bar only -->
    <div style="position:absolute;top:0;left:0;right:0;height:56px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;padding:0 24px;gap:16px;justify-content:space-between;">
      <div class="sk" style="width:100px;height:26px;border-radius:6px;"></div>
      <div style="display:flex;gap:16px;">
        <div class="sk" style="width:44px;height:14px;"></div>
        <div class="sk" style="width:52px;height:14px;"></div>
        <div class="sk" style="width:40px;height:14px;"></div>
        <div class="sk" style="width:48px;height:14px;"></div>
      </div>
      <div style="display:flex;gap:8px;">
        <div class="sk" style="width:30px;height:30px;border-radius:50%;"></div>
        <div class="sk" style="width:30px;height:30px;border-radius:50%;"></div>
      </div>
    </div>
  </div>
  <div id="root" dir="rtl"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>


</html>
