<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes" />

  <!-- Theme bootstrap (runs before first paint — prevents flash + sets first-visit default).
       First-time visitors (no saved preference) default to Light. If reading the saved
       preference fails, the fallback is also Light. A returning visitor's explicit choice
       (light/dark/system) is read from localStorage and respected. -->
  <script>
    (function () {
      var el = document.documentElement;
      el.classList.add('aq-js');
      var resolved = 'light';
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark') resolved = 'dark';
        else if (t === 'light') resolved = 'light';
        else if (t === 'system') resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) {
        resolved = 'light';
      }
      el.classList.remove('dark', 'light');
      el.classList.add(resolved);
    })();
  </script>

  <style>
    :root {
      --background: 201 57% 10%;
      --foreground: 0 0% 100%;
      --primary: 187 88% 35%;
      --primary-foreground: 0 0% 100%;
      --accent: 205 88% 35%;
    }

    body {
      font-family: 'Cairo', Tahoma, sans-serif;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      margin: 0
    }

    /* JavaScript users should never see the crawlable SSR shell flash before
       React paints. No-JS clients keep seeing it because aq-js is never set. */
    html.aq-js #seo-root {
      display: none !important;
    }

    /* If the application still has not mounted after the safety timeout, reveal
       the semantic page instead of leaving the visitor with a blank screen. */
    html.aq-js.aq-client-fallback #seo-root {
      display: block !important;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Cairo', Tahoma, sans-serif;
      font-weight: 700;
      letter-spacing: 0;
    }

    .hero-section {
      position: relative;
      height: 700px;
      width: 100%;
      overflow: hidden
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent, hsl(var(--background)));
      z-index: 10
    }
  </style>
</head>

<body dir="rtl">
  <div id="root" dir="rtl"></div>
  <script defer src="/admin-dashboard-truth.js"></script>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    (function () {
      window.setTimeout(function () {
        var root = document.getElementById('root');
        var shell = document.getElementById('seo-root');
        if (shell && (!root || root.childElementCount === 0)) {
          document.documentElement.classList.add('aq-client-fallback');
        }
      }, 5000);
    })();
  </script>
</body>
