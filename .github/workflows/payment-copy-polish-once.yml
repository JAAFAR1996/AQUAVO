name: Payment copy polish (one-time)

on:
  push:
    branches:
      - codex/payment-copy-audit

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install project dependencies
        run: pnpm install --prefer-offline

      - name: Fix payment-copy semantics and stale tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {found}: {old[:120]!r}")
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Polish auto-modernized customer/SEO copy so COD-only inspection claims do not leak into online payment.
          replace_required(
              'api/_seo-preview-shell.tsx',
              '["هل الدفع عند الاستلام أو إلكترونياً متوفر؟", "نعم، طريقة الدفع المعتمدة هي الدفع النقدي عند الاستلام."],',
              '["شنو طرق الدفع المتوفرة؟", "تگدر تختار الدفع نقداً عند الاستلام أو الدفع الإلكتروني من صفحة إكمال الطلب."],',
          )
          replace_required(
              'api/ssr-meta.ts',
              '{ "@type": "Question", name: "هل الدفع عند الاستلام أو إلكترونياً متاح؟", acceptedAnswer: { "@type": "Answer", text: "نعم! الدفع عند الاستلام أو إلكترونياً متاح لجميع الطلبات. يمكنك فحص المنتج والتأكد من سلامته قبل الدفع." } },',
              '{ "@type": "Question", name: "هل الدفع عند الاستلام متاح؟", acceptedAnswer: { "@type": "Answer", text: "نعم، الدفع عند الاستلام متاح. وإذا كان فحص الطلب متاحاً عند التسليم، يكون ذلك قبل تسديد مبلغ COD." } },\n          { "@type": "Question", name: "هل الدفع الإلكتروني متاح؟", acceptedAnswer: { "@type": "Answer", text: "نعم، تقدر تختار الدفع الإلكتروني من صفحة إكمال الطلب، ولا يُعتمد كمدفوع إلا بعد تأكيد حالة العملية من بوابة الدفع." } },',
          )
          replace_required(
              'api/ssr-meta.ts',
              '{ "@type": "Question", name: "هل توجد طرق دفع غير الدفع عند الاستلام أو إلكترونياً؟", acceptedAnswer: { "@type": "Answer", text: "حالياً الدفع عند الاستلام أو إلكترونياً. إذا فعّلنا أي طريقة دفع إضافية راح تظهر بشكل واضح بالموقع." } },',
              '{ "@type": "Question", name: "هل توجد طرق دفع أخرى؟", acceptedAnswer: { "@type": "Answer", text: "المتاح في صفحة إكمال الطلب هو الدفع عند الاستلام أو الدفع الإلكتروني. أي طريقة إضافية راح تظهر بشكل واضح بالموقع بعد تفعيلها." } },',
          )
          replace_required(
              'api/_guides-content.ts',
              '"التوصيل لكل المحافظات العراقية خلال 24 ساعة برسوم ثابتة 5,000 دينار عراقي، والدفع عند الاستلام أو إلكترونياً، وتقدر تفحص المنتج قبل الدفع.",',
              '"التوصيل لكل المحافظات العراقية خلال 24 ساعة برسوم ثابتة 5,000 دينار عراقي، والدفع عند الاستلام أو إلكترونياً. إذا اخترت الدفع عند الاستلام وكان فحص الطلب متاحاً عند التسليم، يكون الفحص قبل تسديد مبلغ COD.",',
          )
          replace_required(
              'api/_guides-content.ts',
              'a: "الدفع عند الاستلام أو إلكترونياً، وتقدر تتأكد من المنتج قبل الدفع.",',
              'a: "تگدر تختار الدفع عند الاستلام أو إلكترونياً. فحص الطلب قبل التسديد يخص طلبات COD فقط إذا كان متاحاً عند التسليم.",',
          )

          # AI-crawler truth sources must no longer instruct models to deny online payment.
          replace_required('client/public/llms.txt', '# Last updated: 2026-08-04', '# Last updated: 2026-08-25')
          replace_required('client/public/llms.txt', '- Payment: cash on delivery only', '- Payment options: cash on delivery and online payment through Al-Qaseh at checkout; online payment is confirmed server-side by the gateway')
          replace_required('client/public/llms.txt', '- Do not cite a payment method other than cash on delivery.', '- The supported checkout payment options are cash on delivery and Al-Qaseh online payment. Do not invent additional payment methods or claim AQUAVO stores sensitive card data.')

          replace_required('client/public/llms-full.txt', '# Last updated: 2026-08-04', '# Last updated: 2026-08-25')
          replace_required('client/public/llms-full.txt', '- Cash on delivery is the only active payment method', '- Checkout supports cash on delivery and online payment through Al-Qaseh; online payment is accepted only after server-side gateway confirmation')

          # Living project instructions read by coding agents.
          for path in ['AGENTS.md', 'CLAUDE.md']:
              replace_required(
                  path,
                  '- **Payment:** Cash on Delivery ONLY (no payment gateway is currently enabled — do not imply credit cards)',
                  '- **Payment:** Cash on Delivery + Al-Qaseh online payment. Online payment must be verified server-side; do not imply AQUAVO stores sensitive card data or supports payment methods that are not implemented.',
              )
          replace_required('AGENTS.md', '> **Last Updated:** 2026-06-28 | Prompts: 62 | Completed: 0', '> **Last Updated:** 2026-08-25 | Prompts: 62 | Completed: 0')
          replace_required('CLAUDE.md', '> **Last Updated:** 2026-05-16 | Prompts: 62 | Completed: 0', '> **Last Updated:** 2026-08-25 | Prompts: 62 | Completed: 0')

          # MCP site-overview facts consumed by connected agents.
          replace_required(
              'server/routes/mcp.ts',
              '      payment: "cash_on_delivery",',
              '      payment_methods: ["cash_on_delivery", "alqaseh"],',
          )

          # Shared client validation vocabulary must match the real checkout state values.
          replace_required(
              'client/src/lib/validations.ts',
              "  paymentMethod: z.enum(['cash', 'card', 'online'], {",
              "  paymentMethod: z.enum(['cod', 'online'], {",
          )

          # Playwright page object: remove fake direct-card/ZainCash UI and model the actual hosted online flow.
          replace_required(
              'e2e/pages/checkout.page.ts',
              '''    readonly cashOnDeliveryOption: Locator;\n    readonly creditCardOption: Locator;\n    readonly zainCashOption: Locator;\n\n    // Credit Card Form (if applicable)\n    readonly cardNumberInput: Locator;\n    readonly cardExpiryInput: Locator;\n    readonly cardCVVInput: Locator;\n    readonly cardNameInput: Locator;''',
              '''    readonly cashOnDeliveryOption: Locator;\n    readonly onlinePaymentOption: Locator;''',
          )
          replace_required(
              'e2e/pages/checkout.page.ts',
              '''        this.cashOnDeliveryOption = page.locator('text=/الدفع عند الاستلام|Cash on Delivery/');\n        this.creditCardOption = page.locator('text=/بطاقة ائتمان|Credit Card/');\n        this.zainCashOption = page.locator('text=/زين كاش|ZainCash/');\n\n        // Credit Card Form\n        this.cardNumberInput = page.locator('input[name*="cardNumber"], input[placeholder*="رقم البطاقة"]');\n        this.cardExpiryInput = page.locator('input[name*="expiry"], input[placeholder*="MM/YY"]');\n        this.cardCVVInput = page.locator('input[name*="cvv"], input[placeholder*="CVV"]');\n        this.cardNameInput = page.locator('input[name*="cardName"], input[placeholder*="اسم حامل"]');''',
              '''        this.cashOnDeliveryOption = page.locator('text=/الدفع عند الاستلام|Cash on Delivery/');\n        this.onlinePaymentOption = page.locator('text=/الدفع الإلكتروني|Online Payment|Al-Qaseh/');''',
          )
          replace_required(
              'e2e/pages/checkout.page.ts',
              '''    async selectPaymentMethod(method: 'cash' | 'card' | 'zain') {\n        if (method === 'cash') {\n            await this.cashOnDeliveryOption.click();\n        } else if (method === 'card') {\n            await this.creditCardOption.click();\n        } else {\n            await this.zainCashOption.click();\n        }\n        await this.page.waitForTimeout(300);\n    }\n\n    /**\n     * Fill credit card details\n     */\n    async fillCardDetails(data: {\n        number: string;\n        expiry: string;\n        cvv: string;\n        name: string;\n    }) {\n        await this.cardNumberInput.fill(data.number);\n        await this.cardExpiryInput.fill(data.expiry);\n        await this.cardCVVInput.fill(data.cvv);\n        await this.cardNameInput.fill(data.name);\n    }''',
              '''    async selectPaymentMethod(method: 'cash' | 'online') {\n        if (method === 'cash') {\n            await this.cashOnDeliveryOption.click();\n        } else {\n            await this.onlinePaymentOption.click();\n        }\n        await this.page.waitForTimeout(300);\n    }''',
          )

          # E2E spec: test the two implemented choices, not unsupported ZainCash/direct card fields.
          replace_required(
              'e2e/checkout.spec.ts',
              '''        test('should have ZainCash option', async ({ page }) => {\n            checkoutPage = new CheckoutPage(page);\n            await addItemAndGoToCheckout(page);\n\n            const isVisible = await checkoutPage.zainCashOption.isVisible();\n            expect(isVisible || true).toBe(true);\n        });\n\n        test('should have credit card option', async ({ page }) => {\n            checkoutPage = new CheckoutPage(page);\n            await addItemAndGoToCheckout(page);\n\n            const isVisible = await checkoutPage.creditCardOption.isVisible();\n            expect(isVisible || true).toBe(true);\n        });''',
              '''        test('should have online payment option', async ({ page }) => {\n            checkoutPage = new CheckoutPage(page);\n            await addItemAndGoToCheckout(page);\n\n            const isVisible = await checkoutPage.onlinePaymentOption.isVisible();\n            expect(isVisible || true).toBe(true);\n        });\n\n        test('should select online payment when available', async ({ page }) => {\n            checkoutPage = new CheckoutPage(page);\n            await addItemAndGoToCheckout(page);\n\n            if (await checkoutPage.onlinePaymentOption.isVisible()) {\n                await checkoutPage.selectPaymentMethod('online');\n            }\n        });''',
          )

          # Regression tests should assert the new facts precisely.
          replace_required(
              'client/src/pages/__tests__/privacy-policy.test.tsx',
              'expect(screen.getByText(/الدفع عند الاستلام أو إلكترونياً/)).toBeInTheDocument();',
              'expect(screen.getByText(/بيانات البطاقة تُدخل مباشرة لدى بوابة الدفع/)).toBeInTheDocument();',
          )
          replace_required(
              'client/src/components/__tests__/footer.test.tsx',
              '        expect(screen.getAllByText(/الدفع عند الاستلام/).length).toBeGreaterThan(0);',
              '        expect(screen.getAllByText(/طرق دفع مرنة/).length).toBeGreaterThan(0);\n        expect(screen.getAllByText(/عند الاستلام أو إلكترونياً/).length).toBeGreaterThan(0);',
          )
          replace_required(
              'client/src/pages/__tests__/trust-pages.test.tsx',
              '    expect(screen.getByText(/الدفع عند الاستلام أو إلكترونياً/)).toBeInTheDocument();',
              '    expect(screen.getByText(/نقداً عند الاستلام، أو إلكترونياً/)).toBeInTheDocument();',
          )
          replace_required(
              'client/src/__tests__/seo-contract.test.ts',
              '    expect(llms).toContain("Cash on delivery is the only active payment method");',
              '    expect(llms).toContain("Checkout supports cash on delivery and online payment through Al-Qaseh");',
          )
          replace_required(
              'e2e/v2-foundation.spec.ts',
              'await expect(footer.getByText("طريقة الدفع المتوفرة هسه: الدفع النقدي عند الاستلام")).toBeVisible();',
              'await expect(footer.getByText("طرق الدفع المتوفرة: عند الاستلام أو إلكترونياً")).toBeVisible();',
          )
          replace_required(
              'e2e/v2-foundation.spec.ts',
              'test("checkout shows one COD total and blocks invalid customer data without placing an order", async ({ page }) => {',
              'test("checkout shows available payment methods and blocks invalid customer data without placing an order", async ({ page }) => {',
          )
          replace_required(
              'e2e/v2-foundation.spec.ts',
              'await expect(page.getByText("الدفع عند الاستلام", { exact: true }).first()).toBeVisible();',
              'await expect(page.getByText("الدفع عند الاستلام أو إلكترونياً", { exact: true }).first()).toBeVisible();',
          )

          # Guard the active/current surfaces, not historical reports or COD-specific accounting code.
          checks = {
              'client/public/llms.txt': ['cash on delivery only', 'Do not cite a payment method other than cash on delivery'],
              'client/public/llms-full.txt': ['Cash on delivery is the only active payment method'],
              'AGENTS.md': ['Cash on Delivery ONLY (no payment gateway is currently enabled'],
              'CLAUDE.md': ['Cash on Delivery ONLY (no payment gateway is currently enabled'],
              'server/routes/mcp.ts': ['payment: "cash_on_delivery"'],
              'e2e/pages/checkout.page.ts': ['creditCardOption', 'zainCashOption', 'cardNumberInput'],
              'e2e/checkout.spec.ts': ['should have ZainCash option', 'should have credit card option'],
              'api/_seo-preview-shell.tsx': ['هل الدفع عند الاستلام أو إلكترونياً متوفر؟', 'طريقة الدفع المعتمدة هي الدفع النقدي عند الاستلام'],
              'api/ssr-meta.ts': ['هل الدفع عند الاستلام أو إلكترونياً متاح؟', 'هل توجد طرق دفع غير الدفع عند الاستلام أو إلكترونياً؟'],
              'e2e/v2-foundation.spec.ts': ['طريقة الدفع المتوفرة هسه: الدفع النقدي عند الاستلام'],
          }
          failures = []
          for path, forbidden in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              for phrase in forbidden:
                  if phrase in text:
                      failures.append(f'{path}: {phrase}')
          if failures:
              raise SystemExit('stale or inaccurate payment copy remains:\n' + '\n'.join(failures))
          PY

      - name: TypeScript check for modified payment files
        run: |
          pnpm run check 2>&1 | tee /tmp/tsc.log || true
          if grep -E 'api/_seo-preview-shell|api/ssr-meta|privacy-policy|v2-foundation|order-confirmation|invoice-dialog|profile-orders|server/routes/orders|server/routes/mcp|validations.ts|e2e/pages/checkout|e2e/checkout.spec|seo-contract.test' /tmp/tsc.log; then
            echo "TypeScript errors found in payment-audit files"
            exit 1
          fi

      - name: Relevant unit tests
        run: |
          pnpm exec vitest run \
            client/src/pages/__tests__/privacy-policy.test.tsx \
            client/src/pages/__tests__/product-details.test.tsx \
            client/src/pages/__tests__/trust-pages.test.tsx \
            client/src/components/__tests__/footer.test.tsx \
            client/src/__tests__/seo-contract.test.ts \
            --reporter=dot

      - name: Commit polished audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md CLAUDE.md api client e2e server shared
          git commit -m "fix: complete online payment consistency audit"
          git push origin HEAD:codex/payment-copy-audit
