name: Al-Qaseh accounting branch audit (one-time)

on:
  push:
    branches:
      - codex/alqaseh-accounting-production

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Execute payment accounting tests
        run: >-
          pnpm exec vitest run
          server/__tests__/alqaseh-payment-flow.test.ts
          server/__tests__/alqaseh-accounting-contract.test.ts
          server/__tests__/alqaseh-accounting-execution.test.ts
          --reporter=dot

      - name: TypeScript audit for new files
        shell: bash
        run: |
          pnpm run check 2>&1 | tee /tmp/tsc.log || true
          if grep -E 'alqaseh-accounting-execution|apply-alqaseh-accounting-migration' /tmp/tsc.log; then
            echo "TypeScript errors found in Al-Qaseh accounting production files"
            exit 1
          fi

      - name: Remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/alqaseh-accounting-branch-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: validate Al-Qaseh accounting migration execution"
          git push
