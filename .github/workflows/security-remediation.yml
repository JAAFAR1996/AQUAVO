name: Temporary vector accounting PDF verification

on:
  push:
    branches:
      - fix/vector-accounting-pdf-clean-20260924
    paths:
      - client/src/lib/accountant-pdf-vector.tsx
      - client/src/lib/accountant-pdf-v2.ts
      - client/src/components/admin/finance-accounting-register-v2.tsx
      - test/accounting-monthly-management-pack.test.ts
      - test/client-chunk-recovery.test.ts
      - server/__tests__/accounting-v2-automation-contract.test.ts
      - .github/workflows/security-remediation.yml

permissions:
  contents: read

env:
  NODE_VERSION: 20.19.0
  PNPM_VERSION: 10.0.0
  CI: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Strict accounting typecheck
        run: pnpm check:accounting
      - name: Vector PDF and accounting contract tests
        run: >-
          pnpm exec vitest run
          test/accounting-monthly-management-pack.test.ts
          test/client-chunk-recovery.test.ts
          server/__tests__/accounting-v2-automation-contract.test.ts
      - name: Production build
        run: pnpm build
