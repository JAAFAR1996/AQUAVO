name: TEMP Reduce Soil FH-260924-B6A14716

on:
  push:
    branches: [ops/invoice-edit-260924-b6a14716-20260925b]
    paths: [".github/workflows/tmp-edit-invoice-260924-b6a14716.yml"]

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Reduce aquascape soil from 6 bags to 2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;

          DO $block$
          DECLARE
            v_order_id text := 'd6f5c6e1-1153-4d2a-a892-6ab2417248fa';
            v_soil_line_id text;
            v_main_location text;
            v_sale_move_id text;
          BEGIN
            PERFORM 1
            FROM public.orders
            WHERE id=v_order_id
              AND order_number='FH-260924-B6A14716'
              AND status='pending'
              AND total=237188
              AND rounded_total=237250
              AND shipping_cost=5000
              AND discount_total=10000
              AND items_subtotal_snapshot=242188
              AND formula_total_snapshot=237188
              AND rounding_adjustment_snapshot=62
            FOR UPDATE;
            IF NOT FOUND THEN
              RAISE EXCEPTION 'ABORT: unexpected order state';
            END IF;

            PERFORM 1
            FROM public.manual_invoices
            WHERE invoice_no='FH-260924-B6A14716'
              AND order_id=v_order_id
              AND status='confirmed'
              AND subtotal=242188
              AND discount=10000
              AND delivery=5000
              AND total=237250
            FOR UPDATE;
            IF NOT FOUND THEN
              RAISE EXCEPTION 'ABORT: unexpected invoice state';
            END IF;

            SELECT id INTO STRICT v_soil_line_id
            FROM public.order_items_relational
            WHERE order_id=v_order_id
              AND product_id='yee-07509'
              AND quantity=6
              AND price_at_purchase=6498
              AND total_price=38988
              AND metadata->>'variantId'='fine15'
            FOR UPDATE;

            SELECT id INTO STRICT v_main_location
            FROM public.inventory_locations
            WHERE code='MAIN' AND is_active=true
            LIMIT 1;

            SELECT id INTO STRICT v_sale_move_id
            FROM public.inventory_movements
            WHERE idempotency_key='order_item:'||v_soil_line_id
              AND product_id='yee-07509'
              AND variant_id='fine15'
              AND quantity_delta=-6
              AND movement_type='sale';

            IF EXISTS (
              SELECT 1 FROM public.inventory_movements
              WHERE idempotency_key='order_edit:'||v_order_id||':soil-6-to-2'
            ) THEN
              RAISE EXCEPTION 'ABORT: soil reduction already applied';
            END IF;

            UPDATE public.order_items_relational
            SET quantity=2,
                total_price=12996,
                metadata=COALESCE(metadata,'{}'::jsonb) ||
                  jsonb_build_object(
                    'ownerAdjustedQuantity',true,
                    'ownerAdjustedFrom',6,
                    'ownerAdjustedTo',2,
                    'adjustmentReason','Use soil only under planted zones beneath sand'
                  )
            WHERE id=v_soil_line_id;

            INSERT INTO public.inventory_movements(
              product_id,variant_id,location_id,quantity_delta,
              movement_type,source_type,source_id,idempotency_key,
              unit_cost,currency,happened_at,created_by,metadata
            ) VALUES (
              'yee-07509','fine15',v_main_location,4,
              'manual_adjustment','order_edit',v_order_id,
              'order_edit:'||v_order_id||':soil-6-to-2',
              1747,'IQD',clock_timestamp(),'owner_requested_chatgpt',
              jsonb_build_object(
                'invoice_no','FH-260924-B6A14716',
                'order_item_id',v_soil_line_id,
                'original_sale_movement_id',v_sale_move_id,
                'reason','Reduce aquascape soil from 6 bags to 2 before delivery'
              )
            );

            UPDATE public.orders o
            SET items = (
                  SELECT jsonb_agg(
                    CASE
                      WHEN e->>'productId'='yee-07509' AND e->>'variantId'='fine15'
                      THEN jsonb_set(
                             jsonb_set(e,'{quantity}','2'::jsonb,false),
                             '{lineTotal}','12996'::jsonb,false
                           )
                      ELSE e
                    END
                    ORDER BY ord
                  )
                  FROM jsonb_array_elements(o.items) WITH ORDINALITY a(e,ord)
                ),
                total=211196,
                rounded_total=211250,
                items_subtotal_snapshot=216196,
                formula_total_snapshot=211196,
                rounding_adjustment_snapshot=54,
                updated_at=clock_timestamp()
            WHERE o.id=v_order_id;

            UPDATE public.manual_invoices mi
            SET items = (
                  SELECT jsonb_agg(
                    CASE
                      WHEN e->>'productId'='yee-07509' AND e->>'variantId'='fine15'
                      THEN jsonb_set(
                             jsonb_set(e,'{quantity}','2'::jsonb,false),
                             '{total}','12996'::jsonb,false
                           )
                      ELSE e
                    END
                    ORDER BY ord
                  )
                  FROM jsonb_array_elements(mi.items) WITH ORDINALITY a(e,ord)
                ),
                subtotal=216196,
                total=211250,
                updated_at=clock_timestamp()
            WHERE mi.invoice_no='FH-260924-B6A14716';

          END
          $block$;

          COMMIT;
          SQL

          echo "=== VERIFY_ORDER ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            SELECT order_number || '|' || status || '|' || total::text || '|' ||
                   rounded_total::text || '|' || items_subtotal_snapshot::text || '|' ||
                   formula_total_snapshot::text || '|' || rounding_adjustment_snapshot::text
            FROM public.orders
            WHERE order_number='FH-260924-B6A14716';
          "

          echo "=== VERIFY_SOIL_LINE ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            SELECT oi.product_id || '|' || oi.quantity::text || '|' ||
                   oi.price_at_purchase::text || '|' || oi.total_price::text || '|' ||
                   COALESCE(oi.metadata->>'variantId','')
            FROM public.order_items_relational oi
            JOIN public.orders o ON o.id=oi.order_id
            WHERE o.order_number='FH-260924-B6A14716'
              AND oi.product_id='yee-07509';
          "

          echo "=== VERIFY_MANUAL ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            SELECT invoice_no || '|' || subtotal::text || '|' ||
                   discount::text || '|' || delivery::text || '|' || total::text || '|' || token
            FROM public.manual_invoices
            WHERE invoice_no='FH-260924-B6A14716';
          "

          echo "=== VERIFY_SOIL_STOCK ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            WITH main AS (
              SELECT id FROM public.inventory_locations
              WHERE code='MAIN' AND is_active=true LIMIT 1
            )
            SELECT 'ledger|' || COALESCE(SUM(im.quantity_delta),0)::text
            FROM public.inventory_movements im
            WHERE im.location_id=(SELECT id FROM main)
              AND im.product_id='yee-07509'
              AND im.variant_id='fine15'
            UNION ALL
            SELECT 'variant|' || (v->>'stock')
            FROM public.products p
            CROSS JOIN LATERAL jsonb_array_elements(p.variants) AS a(v)
            WHERE p.id='yee-07509' AND v->>'id'='fine15';
          "
