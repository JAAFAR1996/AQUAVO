name: TEMP Inspect Soil Sale Pattern FH-260924-B6A14716

on:
  push:
    branches: [ops/invoice-edit-260924-b6a14716-20260925b]
    paths: [".github/workflows/tmp-edit-invoice-260924-b6a14716.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Inspect recent soil sale pattern
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"

          echo "=== RECENT_SOIL_ORDER_ITEMS ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            SELECT to_jsonb(oi)::text
            FROM public.order_items_relational oi
            JOIN public.orders o ON o.id=oi.order_id
            WHERE oi.product_id='yee-07509'
            ORDER BY o.created_at DESC
            LIMIT 5;
          "

          echo "=== RECENT_SOIL_MOVEMENTS ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            SELECT to_jsonb(im)::text
            FROM public.inventory_movements im
            WHERE im.product_id='yee-07509'
            ORDER BY im.happened_at DESC NULLS LAST, im.created_at DESC
            LIMIT 10;
          "

          echo "=== PRODUCT_COST_RESOLUTION ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            SELECT id || '|' || COALESCE(cost_price::text,'') || '|' ||
                   COALESCE(cost_price_resolution,'') || '|' ||
                   COALESCE(packaging_cost::text,'') || '|' ||
                   COALESCE(packaging_cost_resolution,'') || '|' ||
                   COALESCE(insert_cost::text,'') || '|' ||
                   COALESCE(insert_cost_resolution,'')
            FROM public.products WHERE id='yee-07509';
          "
