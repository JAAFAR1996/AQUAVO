name: TEMP Inspect Sand FH-260924-B6A14716

on:
  push:
    branches: [ops/invoice-edit-260924-b6a14716-20260925b]
    paths: [".github/workflows/tmp-edit-invoice-260924-b6a14716.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Inspect sand products and invoice sand lines
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "=== SAND_PRODUCTS ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            SELECT id || '|' || slug || '|' || name || '|' || price::text || '|' ||
                   stock::text || '|' || COALESCE(variants::text,'null') || '|' ||
                   COALESCE(thumbnail,'')
            FROM public.products
            WHERE deleted_at IS NULL
              AND (
                name ILIKE '%رمل%'
                OR name ILIKE '%sand%'
                OR slug ILIKE '%sand%'
              )
            ORDER BY name;
          "

          echo "=== ORDER_SAND_LINES ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            SELECT (e->>'productId') || '|' || COALESCE(e->>'productName','') || '|' ||
                   COALESCE(e->>'variantId','') || '|' || COALESCE(e->>'variantLabel','') || '|' ||
                   COALESCE(e->>'quantity','') || '|' || COALESCE(e->>'priceAtPurchase','') || '|' ||
                   COALESCE(e->>'lineTotal','')
            FROM public.orders o
            CROSS JOIN LATERAL jsonb_array_elements(o.items) e
            WHERE o.order_number='FH-260924-B6A14716'
              AND (
                (e->>'productName') ILIKE '%رمل%'
                OR (e->>'productName') ILIKE '%لمی%'
                OR (e->>'productId') ILIKE '%sand%'
              );
          "

          echo "=== MANUAL_SAND_LINES ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            SELECT (e->>'productId') || '|' || COALESCE(e->>'name','') || '|' ||
                   COALESCE(e->>'variantId','') || '|' || COALESCE(e->>'variantLabel','') || '|' ||
                   COALESCE(e->>'quantity','') || '|' || COALESCE(e->>'unitPrice','') || '|' ||
                   COALESCE(e->>'total','')
            FROM public.manual_invoices mi
            CROSS JOIN LATERAL jsonb_array_elements(mi.items) e
            WHERE mi.invoice_no='FH-260924-B6A14716'
              AND (
                (e->>'name') ILIKE '%رمل%'
                OR (e->>'name') ILIKE '%لمی%'
                OR (e->>'productId') ILIKE '%sand%'
              );
          "

          echo "=== CURRENT_TOTALS ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            SELECT 'order|' || total::text || '|' || rounded_total::text || '|' ||
                   items_subtotal_snapshot::text || '|' || formula_total_snapshot::text || '|' ||
                   rounding_adjustment_snapshot::text
            FROM public.orders WHERE order_number='FH-260924-B6A14716'
            UNION ALL
            SELECT 'manual|' || total::text || '|' || subtotal::text || '|' ||
                   discount::text || '|' || delivery::text || '|'
            FROM public.manual_invoices WHERE invoice_no='FH-260924-B6A14716';
          "
