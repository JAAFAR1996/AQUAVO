name: TEMP Inspect Invoice Status FH-260924-B6A14716
on:
  push:
    branches: [ops/invoice-edit-260924-b6a14716-20260925b]
    paths: [".github/workflows/tmp-edit-invoice-260924-b6a14716.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Inspect manual invoice status constraints
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "=== CONSTRAINTS ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            SELECT conname || '|' || pg_get_constraintdef(oid)
            FROM pg_constraint
            WHERE conrelid='public.manual_invoices'::regclass
            ORDER BY conname;
          "
          echo "=== TARGET ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            SELECT invoice_no || '|' || status || '|' || COALESCE(confirmed_at::text,'') || '|' ||
                   COALESCE(sent_at::text,'') || '|' || COALESCE(order_id,'') || '|' || token
            FROM public.manual_invoices
            WHERE invoice_no='FH-260924-B6A14716';
          "
