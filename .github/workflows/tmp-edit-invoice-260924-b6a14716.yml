name: TEMP Restore Approval Button FH-260924-B6A14716
on:
  push:
    branches: [ops/invoice-edit-260924-b6a14716-20260925b]
    paths: [".github/workflows/tmp-edit-invoice-260924-b6a14716.yml"]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Restore invoice to sent state for customer re-approval
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          DO $block$
          BEGIN
            UPDATE public.manual_invoices
            SET status='sent',
                confirmed_at=NULL,
                rejected_at=NULL,
                updated_at=clock_timestamp()
            WHERE invoice_no='FH-260924-B6A14716'
              AND status='draft'
              AND order_id='d6f5c6e1-1153-4d2a-a892-6ab2417248fa';
            IF NOT FOUND THEN
              RAISE EXCEPTION 'Invoice not in expected draft state';
            END IF;
          END
          $block$;
          COMMIT;
          SQL

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            SELECT invoice_no || '|' || status || '|' || COALESCE(confirmed_at::text,'') || '|' ||
                   COALESCE(rejected_at::text,'') || '|' || COALESCE(order_id,'') || '|' || token
            FROM public.manual_invoices
            WHERE invoice_no='FH-260924-B6A14716';
          "
