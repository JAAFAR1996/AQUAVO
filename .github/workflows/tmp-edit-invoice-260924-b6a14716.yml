name: TEMP Inspect River Sand FH-260924-B6A14716

on:
  push:
    branches: [ops/invoice-edit-260924-b6a14716-20260925b]
    paths: [".github/workflows/tmp-edit-invoice-260924-b6a14716.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Inspect exact river sand and current Dutch sand line
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          echo "=== RIVER_SAND ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            SELECT id || '|' || name || '|' || price::text || '|' || stock::text || '|' ||
                   COALESCE(specifications::text,'{}') || '|' ||
                   COALESCE(cost_price::text,'') || '|' ||
                   COALESCE(packaging_cost::text,'') || '|' ||
                   COALESCE(insert_cost::text,'') || '|' ||
                   COALESCE(thumbnail,'')
            FROM public.products
            WHERE id='houyi-river-sand';
          "

          echo "=== DUTCH_RELATIONAL ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            SELECT to_jsonb(oi)::text
            FROM public.order_items_relational oi
            JOIN public.orders o ON o.id=oi.order_id
            WHERE o.order_number='FH-260924-B6A14716'
              AND oi.product_id='houyi-dutch-sand';
          "

          echo "=== DUTCH_MOVEMENT ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            SELECT to_jsonb(im)::text
            FROM public.inventory_movements im
            WHERE im.idempotency_key IN (
              SELECT 'order_item:'||oi.id
              FROM public.order_items_relational oi
              JOIN public.orders o ON o.id=oi.order_id
              WHERE o.order_number='FH-260924-B6A14716'
                AND oi.product_id='houyi-dutch-sand'
            )
            ORDER BY im.created_at;
          "

          echo "=== RIVER_STOCK ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            WITH main AS (
              SELECT id FROM public.inventory_locations
              WHERE code='MAIN' AND is_active=true LIMIT 1
            )
            SELECT COALESCE(SUM(quantity_delta),0)::text
            FROM public.inventory_movements
            WHERE location_id=(SELECT id FROM main)
              AND product_id='houyi-river-sand'
              AND variant_id IS NULL;
          "
