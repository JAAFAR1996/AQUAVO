name: Inventory Checkout Diagnosis 2026-08-28

on:
  push:
    branches:
      - ops/oxygen-tube-stock-fix-20260828
    paths:
      - .github/workflows/oxygen-tube-stock-fix-20260828.yml

permissions:
  contents: read

concurrency:
  group: oxygen-tube-stock-fix-20260828
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Find every storefront-ledger mismatch read-only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          \pset pager off

          WITH main AS (
            SELECT id FROM public.inventory_locations
            WHERE code='MAIN' AND is_active=true
            LIMIT 1
          ), advertised AS (
            SELECT p.id AS product_id,p.name,NULL::text AS variant_id,
                   NULL::text AS variant_label,p.stock::bigint AS advertised_stock
            FROM public.products p
            WHERE p.deleted_at IS NULL
              AND COALESCE(p.has_variants,false)=false
              AND p.price::numeric>0
            UNION ALL
            SELECT p.id,p.name,v->>'id',v->>'label',
                   COALESCE(NULLIF(v->>'stock','')::bigint,0)
            FROM public.products p
            CROSS JOIN LATERAL jsonb_array_elements(COALESCE(p.variants,'[]'::jsonb)) v
            WHERE p.deleted_at IS NULL
              AND COALESCE(p.has_variants,false)=true
              AND p.price::numeric>0
          ), scored AS (
            SELECT a.*,
                   COALESCE((SELECT SUM(im.quantity_delta)::bigint
                     FROM public.inventory_movements im,main
                     WHERE im.product_id=a.product_id
                       AND im.variant_id IS NOT DISTINCT FROM a.variant_id
                       AND im.location_id=main.id),0) AS canonical_stock
            FROM advertised a
          )
          SELECT product_id,name,variant_id,variant_label,advertised_stock,canonical_stock,
                 advertised_stock-canonical_stock AS difference
          FROM scored
          WHERE advertised_stock<>canonical_stock
          ORDER BY ABS(advertised_stock-canonical_stock) DESC,product_id,variant_id NULLS FIRST;

          SELECT p.id,p.name,p.stock,p.has_variants,
                 jsonb_pretty(COALESCE(p.variants,'[]'::jsonb)) AS variants
          FROM public.products p
          WHERE p.deleted_at IS NULL
            AND (p.name ILIKE '%كيس%شبكي%'
              OR p.name ILIKE '%شبكي%فلتر%'
              OR p.id ILIKE '%net-bag%'
              OR p.id='houyi-oxygenation-tube')
          ORDER BY p.id;

          WITH main AS (
            SELECT id FROM public.inventory_locations WHERE code='MAIN' AND is_active=true LIMIT 1
          )
          SELECT p.id,p.name,v->>'id' AS variant_id,v->>'label' AS label,
                 COALESCE(NULLIF(v->>'stock','')::bigint,0) AS advertised_stock,
                 COALESCE((SELECT SUM(im.quantity_delta)::bigint
                   FROM public.inventory_movements im,main
                   WHERE im.product_id=p.id
                     AND im.variant_id IS NOT DISTINCT FROM v->>'id'
                     AND im.location_id=main.id),0) AS canonical_stock
          FROM public.products p
          CROSS JOIN LATERAL jsonb_array_elements(COALESCE(p.variants,'[]'::jsonb)) v
          WHERE p.deleted_at IS NULL
            AND (p.name ILIKE '%كيس%شبكي%'
              OR p.name ILIKE '%شبكي%فلتر%'
              OR p.id ILIKE '%net-bag%'
              OR p.id='houyi-oxygenation-tube')
          ORDER BY p.id,v->>'id';
          SQL

          echo "Read-only inventory diagnosis complete; no stock was changed."
          exit 1
