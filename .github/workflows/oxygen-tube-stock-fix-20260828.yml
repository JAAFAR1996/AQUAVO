name: Oxygen Tube Stock Repair 2026-08-28

on:
  push:
    branches:
      - ops/oxygen-tube-stock-fix-20260828
    paths:
      - migrations/0088_variant_stock_ledger_sync_and_oxygen_tube_repair.sql
      - .github/workflows/oxygen-tube-stock-fix-20260828.yml

permissions:
  contents: read

concurrency:
  group: oxygen-tube-stock-fix-20260828
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout guarded repair
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            migrations/0088_variant_stock_ledger_sync_and_oxygen_tube_repair.sql
          sparse-checkout-cone-mode: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Diagnose hose inventory history read-only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT p.id,p.slug,p.name,p.has_variants,p.stock,
                 jsonb_pretty(COALESCE(p.variants,'[]'::jsonb)) AS variants
          FROM public.products p
          WHERE p.id='houyi-oxygenation-tube';

          SELECT im.variant_id,im.quantity_delta,im.movement_type,im.source_type,
                 im.source_id,im.idempotency_key,im.happened_at,im.created_at,
                 im.created_by,im.metadata
          FROM public.inventory_movements im
          JOIN public.inventory_locations il ON il.id=im.location_id
          WHERE il.code='MAIN' AND il.is_active=true
            AND im.product_id='houyi-oxygenation-tube'
          ORDER BY im.variant_id NULLS FIRST,im.happened_at,im.created_at,im.id;

          SELECT im.variant_id,
                 COALESCE(SUM(im.quantity_delta),0) AS canonical_stock,
                 COALESCE(SUM(CASE WHEN im.quantity_delta<0 THEN -im.quantity_delta ELSE 0 END),0) AS total_out,
                 COALESCE(SUM(CASE WHEN im.quantity_delta>0 THEN im.quantity_delta ELSE 0 END),0) AS total_in,
                 COUNT(*) AS movement_count
          FROM public.inventory_movements im
          JOIN public.inventory_locations il ON il.id=im.location_id
          WHERE il.code='MAIN' AND il.is_active=true
            AND im.product_id='houyi-oxygenation-tube'
          GROUP BY im.variant_id
          ORDER BY im.variant_id NULLS FIRST;
          SQL

          echo "Read-only movement diagnosis complete; no stock was changed."
          exit 1

      - name: Apply canonical stock repair and durable guard
        if: ${{ false }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0088_variant_stock_ledger_sync_and_oxygen_tube_repair.sql
