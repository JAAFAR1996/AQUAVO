name: Oxygen Tube Stock Repair 2026-08-28

on:
  push:
    branches:
      - ops/oxygen-tube-stock-fix-20260828
    paths:
      - migrations/0088_variant_stock_ledger_sync_and_oxygen_tube_repair.sql
      - .github/workflows/oxygen-tube-stock-fix-20260828.yml

permissions:
  contents: read

concurrency:
  group: oxygen-tube-stock-fix-20260828
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout guarded repair
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            migrations/0088_variant_stock_ledger_sync_and_oxygen_tube_repair.sql
          sparse-checkout-cone-mode: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Diagnose live target identity read-only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT p.id,p.slug,p.name,p.has_variants,p.stock,
                 jsonb_pretty(COALESCE(p.variants,'[]'::jsonb)) AS variants
          FROM public.products p
          WHERE p.id='houyi-oxygenation-tube'
             OR p.slug='houyi-oxygenation-tube'
             OR p.name ILIKE '%خرطوم%هواء%ملو%'
             OR p.name ILIKE '%oxygen%tube%';

          SELECT p.id,p.name,v->>'id' AS variant_id,v->>'label' AS label,
                 v->>'stock' AS advertised_stock,
                 COALESCE((
                   SELECT SUM(im.quantity_delta)
                   FROM public.inventory_movements im
                   JOIN public.inventory_locations il ON il.id=im.location_id
                   WHERE il.code='MAIN' AND il.is_active=true
                     AND im.product_id=p.id
                     AND im.variant_id IS NOT DISTINCT FROM v->>'id'
                 ),0) AS canonical_stock
          FROM public.products p
          CROSS JOIN LATERAL jsonb_array_elements(COALESCE(p.variants,'[]'::jsonb)) v
          WHERE p.id='houyi-oxygenation-tube'
             OR p.slug='houyi-oxygenation-tube'
             OR p.name ILIKE '%خرطوم%هواء%ملو%'
             OR p.name ILIKE '%oxygen%tube%'
          ORDER BY p.id,v->>'id';
          SQL

          echo "Read-only diagnosis complete; mutation intentionally blocked in this run."
          exit 1

      - name: Apply canonical stock repair and durable guard
        if: ${{ false }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0088_variant_stock_ledger_sync_and_oxygen_tube_repair.sql
