name: Temp Canva Fullres V2
on:
  push:
    branches: [tmp/canva-fullres-v2]
    paths: ['.github/workflows/tmp-canva-fullres-v2.yml']
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch full-size hero and commit
        shell: bash
        run: |
          set -euo pipefail
          URL='https://media.canva.com/v2/image-resize/format:PNG/height:1254/quality:100/uri:ifs%3A%2F%2FM%2F9bc1a8c5-a305-4bf6-a03d-34677179963f/watermark:F/width:1254?csig=AAAAAAAAAAAAAAAAAAAAAOZR7r1LkYqseFoMMnq13hF2KW4YFad8G7gy9AQzltWD&exp=1788152077&osig=AAAAAAAAAAAAAAAAAAAAAI1uNiODmndSrIjM1qm5iu7WhZDgMizbBWQ-X67XtTjg&signer=media-rpc&x-canva-quality=thumbnail'
          mkdir -p tmp
          curl -L --fail --retry 2 -o tmp/canva-hero-test.png "$URL"
          file tmp/canva-hero-test.png
          python - <<'PY'
          from PIL import Image
          p='tmp/canva-hero-test.png'
          im=Image.open(p)
          print(im.size, im.mode)
          assert im.size == (1254,1254), im.size
          PY
          test $(wc -c < tmp/canva-hero-test.png) -gt 100000
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/canva-hero-test.png
          git commit -m 'test: capture full-size Canva hero'
          git push
