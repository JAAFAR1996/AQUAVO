name: QR service architecture update

on:
  push:
    branches:
      - feat/qr-service-architecture-20260813
    paths:
      - .github/workflows/qr-service-architecture-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qr-service-architecture-20260813
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply QR page information architecture update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('client/public/qr/index.html')
          s = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing expected text for {label}')
              s = s.replace(old, new, 1)

          replace_once(
              '<meta property="og:description" content="معدات، تصميم، تنفيذ وصيانة — للبيت، للمشروع، وللمحل.">',
              '<meta property="og:description" content="معدات، تصميم وتنفيذ، تركيب وصيانة، مشاريع وجملة — للبيت، للمشروع، وللمحل.">',
              'og description'
          )

          replace_once(
              '<p class="hero__sub motion-item" data-motion="text">معدات، تصميم، تنفيذ وصيانة — للبيت، للمشروع، وللمحل.</p>',
              '<p class="hero__sub motion-item" data-motion="text">معدات، تصميم وتنفيذ، تركيب وصيانة، مشاريع وجملة — للبيت، للمشروع، وللمحل.</p>',
              'hero scope'
          )

          replace_once(
              '<span class="index__sub">تصميم · تنفيذ · صيانة · مشاريع · جملة</span>',
              '<span class="index__sub">تصميم · تنفيذ · تركيب · صيانة · مشاريع · جملة</span>',
              'index services scent'
          )

          replace_once(
              '<span class="index__sub">تصميم، صيانة أو استفسار</span>',
              '<span class="index__sub">شراء، خدمة أو استفسار</span>',
              'contact scent'
          )

          replace_once(
              '<p class="sys__lead motion-item" data-motion="text">من التصميم والتركيب، للتشغيل والصيانة.</p>',
              '<p class="sys__lead motion-item" data-motion="text">من شراء المعدات، للتصميم والتركيب والصيانة، إلى المشاريع وتجهيز المحلات.</p>',
              'services lead'
          )

          css_old = '.svc__extraList{margin:0;color:rgba(255,255,255,.72);font-size:var(--aqv-type-label);line-height:2}'
          css_new = css_old + '''
    .svc__inlineLink{display:inline-flex;align-items:center;margin-inline-start:6px;color:var(--aqv-primary);font-size:var(--aqv-type-label);font-weight:700;text-decoration:underline;text-underline-offset:3px}
    .svc__details{grid-column:2;margin-top:14px;border-top:1px solid rgba(255,255,255,.12)}
    .svc__details summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--aqv-primary);font-size:var(--aqv-type-label);font-weight:700;cursor:pointer;list-style:none}
    .svc__details summary::-webkit-details-marker{display:none}
    .svc__details summary::after{content:"+";font-family:var(--aqv-font-en);font-size:18px;font-weight:400;line-height:1}
    .svc__details[open] summary::after{content:"−"}
    .svc__detailsBody{padding:0 0 8px;color:rgba(255,255,255,.72);font-size:var(--aqv-type-label);line-height:2}
'''
          replace_once(css_old, css_new, 'progressive disclosure css')

          pattern = re.compile(r'      <div class="svc"><ol class="svc__list">.*?</ol></div>\n      <div class="svc__extra motion-item" data-motion="text">.*?</div>', re.S)
          new_services = '''      <div class="svc"><ol class="svc__list">
        <li class="svc__item motion-item" data-motion="text"><span class="svc__no en" aria-hidden="true">01</span><h3 class="svc__name">المتجر والمعدات</h3><p class="svc__body">معدات ومستلزمات للأحواض للشراء المباشر، من الفلترة والتهوية إلى الاختبارات ومواد العناية. <a class="svc__inlineLink" href="https://www.aquavoiq.com/products?utm_source=business_card&utm_medium=qr&utm_campaign=aquavo_qr&utm_content=services">افتح المتجر</a></p></li>
        <li class="svc__item motion-item" data-motion="text"><span class="svc__no en" aria-hidden="true">02</span><h3 class="svc__name">تصميم وتنفيذ الأحواض</h3><p class="svc__body">نصمم الحوض على قياس المكان واستخدامه، ونرتب من البداية الشكل والمعدات وطريقة الصيانة.</p></li>
        <li class="svc__item motion-item" data-motion="text"><span class="svc__no en" aria-hidden="true">03</span><h3 class="svc__name">تركيب وتأسيس الأحواض</h3><p class="svc__body">نركب الحوض ومعداته، ونضبط الفلترة والإضاءة والتهوية، مع تأسيس ومتابعة أولية حسب الحالة.</p></li>
        <li class="svc__item motion-item" data-motion="text"><span class="svc__no en" aria-hidden="true">04</span><h3 class="svc__name">صيانة واستقرار الحوض</h3><div class="svc__meta"><span class="svc__sub en">AQUAVO Care</span></div><p class="svc__body">فحص وصيانة مدروسة مع متابعة وتقرير واضح، مو مجرد تنظيف.</p><details class="svc__details"><summary>شنو تشمل خدمات Care؟</summary><div class="svc__detailsBody">تقييم أولي بالصور والفيديو · معاينة · صيانة أساسية وPlus · تنظيف عميق · إنقاذ وإعادة استقرار · نقل وإعادة تركيب · رعاية أثناء السفر</div></details></li>
        <li class="svc__item motion-item" data-motion="text"><span class="svc__no en" aria-hidden="true">05</span><h3 class="svc__name">خدمة المشاريع</h3><div class="svc__meta"><span class="svc__sub en">AQUAVO Business</span><span class="svc__tag">للمشاريع</span></div><p class="svc__body">للمطاعم والعيادات والفنادق والشركات: تنفيذ ومتابعة دورية، سجل صيانة وتقارير وأولوية وقت الحاجة.</p></li>
        <li class="svc__item motion-item" data-motion="text"><span class="svc__no en" aria-hidden="true">06</span><h3 class="svc__name">تجهيز المحلات بالجملة</h3><div class="svc__meta"><span class="svc__tag">للمحلات</span></div><p class="svc__body">نجهز المحلات والتجار بمعدات ومستلزمات الأحواض بكميات جملة، والتجهيز يصير مباشرة ويانه على واتساب.</p></li>
      </ol></div>'''
          s2, count = pattern.subn(new_services, s, count=1)
          if count != 1:
              raise SystemExit(f'Service block replacement count was {count}')
          s = s2

          replace_once(
              '<h2 class="cta__h motion-item" data-motion="text" id="cta-title">مو متأكد شنو يحتاج حوضك أو مكانك؟</h2>',
              '<h2 class="cta__h motion-item" data-motion="text" id="cta-title">مو متأكد شنو تحتاج؟</h2>',
              'CTA heading'
          )

          replace_once(
              '<p class="cta__p motion-item" data-motion="text">دز إلنا صورة أو فيديو، واحچيلنا شنو ببالك، ونرتب وياك الخطوة الجاية.</p>',
              '<p class="cta__p motion-item" data-motion="text">سواء تريد قطعة، صيانة، مشروع أو تجهيز جملة — احچيلنا شنو تحتاج، ونوجهك للمسار المناسب.</p>',
              'CTA copy'
          )

          old_footer_links = '<div class="foot__links motion-item" data-motion="text"><a href="https://www.aquavoiq.com/products?utm_source=business_card&utm_medium=qr&utm_campaign=aquavo_qr&utm_content=footer" class="en">aquavoiq.com</a><a href="mailto:info@aquavoiq.com" class="en">info@aquavoiq.com</a><a href="https://wa.me/9647747880673?text=%D9%87%D9%84%D8%A7%20AQUAVO%D8%8C%20%D8%AC%D8%A7%D9%8A%20%D9%85%D9%86%20%D9%83%D8%A7%D8%B1%D8%AA%20AQUAVO%20%D9%88%D8%B9%D9%86%D8%AF%D9%8A%20%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%A7%D8%B1." target="_blank" rel="noopener noreferrer">واتساب</a></div>'
          new_footer_links = '<div class="foot__links motion-item" data-motion="text"><a href="https://www.aquavoiq.com/products?utm_source=business_card&utm_medium=qr&utm_campaign=aquavo_qr&utm_content=footer">المتجر</a><a href="https://wa.me/9647747880673?text=%D9%87%D9%84%D8%A7%20AQUAVO%D8%8C%20%D8%AC%D8%A7%D9%8A%20%D9%85%D9%86%20%D9%83%D8%A7%D8%B1%D8%AA%20AQUAVO%20%D9%88%D8%B9%D9%86%D8%AF%D9%8A%20%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%A7%D8%B1." target="_blank" rel="noopener noreferrer">واتساب</a><a href="https://www.instagram.com/aquavo_iq/" target="_blank" rel="noopener noreferrer" aria-label="AQUAVO على إنستغرام">إنستغرام <span class="en">@aquavo_iq</span></a><a href="mailto:info@aquavoiq.com" class="en">info@aquavoiq.com</a></div>'
          replace_once(old_footer_links, new_footer_links, 'footer links')

          replace_once(
              '<p class="foot__legal motion-item" data-motion="text">AQUAVO — بغداد، العراق<br>نوفر معدات ومستلزمات الأحواض، ويا التصميم والتنفيذ والصيانة. الأسماك والكائنات الحية مو ضمن البيع.</p>',
              '<p class="foot__legal motion-item" data-motion="text">AQUAVO — بغداد، العراق<br>نوفر معدات ومستلزمات الأحواض، التصميم والتنفيذ، التركيب والصيانة، خدمات المشاريع وتجهيز المحلات بالجملة. الأسماك والكائنات الحية مو ضمن البيع.</p>',
              'footer scope'
          )

          path.write_text(s, encoding='utf-8')
          PY

      - name: Verify page markers
        shell: bash
        run: |
          grep -q 'المتجر والمعدات' client/public/qr/index.html
          grep -q 'تركيب وتأسيس الأحواض' client/public/qr/index.html
          grep -q 'شنو تشمل خدمات Care؟' client/public/qr/index.html
          grep -q 'تقييم أولي بالصور والفيديو' client/public/qr/index.html
          grep -q 'instagram.com/aquavo_iq' client/public/qr/index.html
          grep -q 'شراء، خدمة أو استفسار' client/public/qr/index.html
          grep -q 'مشاريع وجملة' client/public/qr/index.html

      - name: Commit page update and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/qr-service-architecture-update.yml
          git add client/public/qr/index.html .github/workflows/qr-service-architecture-update.yml
          git commit -m 'Refine QR service architecture and add Instagram'
          git push origin HEAD:feat/qr-service-architecture-20260813
