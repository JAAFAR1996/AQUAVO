name: 🚀 Enhanced CI/CD Pipeline - FIST-LIVE (Antigravity Ready)

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  NODE_VERSION: 20.19.0
  PNPM_VERSION: 10.0.0
  CI: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== SETUP ====================
  setup:
    name: 📋 Environment Setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      node-version: ${{ steps.versions.outputs.node }}
      pnpm-version: ${{ steps.versions.outputs.pnpm }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 One-shot PR92 canonical inventory test repair
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/checkout-canonical-inventory'
        shell: bash
        run: |
          git checkout fix/checkout-canonical-inventory
          python3 - <<'PY'
          from pathlib import Path
          import re

          orders = Path('server/__tests__/orders-api.test.ts')
          s = orders.read_text()
          replacements = {
              "        expect(productUpdates[0].stock).toBe(3);": "        // Checkout must not write products.stock directly; the canonical ledger projection owns deduction.\n        expect(productUpdates).toHaveLength(0);",
              "        expect(productUpdates[0].variants[0].stock).toBe(1);\n        expect(productUpdates[0].variants[1].stock).toBe(2);": "        // Variant stock is projected from inventory_movements; checkout performs no direct product update.\n        expect(productUpdates).toHaveLength(0);",
              "        expect(productUpdates[0].stock).toBe(4);": "        // Loyalty checkout uses the same canonical inventory path and must not mutate products.stock directly.\n        expect(productUpdates).toHaveLength(0);",
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
          orders.write_text(s)

          invariant = Path('server/__tests__/order-cost-snapshot-invariant.test.ts')
          s = invariant.read_text()
          s = s.replace(
              "    expect(h.state.productUpdates).toHaveLength(0); // stock deduction reverted too",
              "    expect(h.state.productUpdates).toHaveLength(0); // no direct product-stock write escaped either",
              1,
          )
          old = '''  it("deducts inventory exactly once per line", async () => {
    const h = makeHarness({
      productRows: { "p-known": KNOWN_COST_PRODUCT, "p-zero": VERIFIED_ZERO_PRODUCT },
    });
    await h.storage.createOrderSecure(null, [
      { productId: "p-known", quantity: 2 },
      { productId: "p-zero", quantity: 3 },
    ], CUSTOMER);

    const stockUpdates = h.state.productUpdates.filter((u) => "stock" in u.payload);
    expect(stockUpdates).toHaveLength(2);
    expect(stockUpdates[0].payload.stock).toBe(8);  // 10 - 2
    expect(stockUpdates[1].payload.stock).toBe(7);  // 10 - 3
  });'''
          new = '''  it("routes each sale line through the canonical ledger without direct product writes", async () => {
    const h = makeHarness({
      productRows: { "p-known": KNOWN_COST_PRODUCT, "p-zero": VERIFIED_ZERO_PRODUCT },
    });
    await h.storage.createOrderSecure(null, [
      { productId: "p-known", quantity: 2 },
      { productId: "p-zero", quantity: 3 },
    ], CUSTOMER);

    // The relational order-line insert is the sale entry point. Database triggers
    // append inventory_movements and project the resulting balance to storefront stock.
    expect(h.state.productUpdates).toHaveLength(0);
    expect(h.state.orderItemInserts).toHaveLength(2);
    expect(h.state.orderItemInserts.map((line) => ({
      productId: line.productId,
      quantity: line.quantity,
    }))).toEqual([
      { productId: "p-known", quantity: 2 },
      { productId: "p-zero", quantity: 3 },
    ]);
  });'''
          if old in s:
              s = s.replace(old, new, 1)
          invariant.write_text(s)

          quarantine = Path('server/__tests__/auto-order-processor-quarantine.test.ts')
          s = quarantine.read_text()
          pattern = re.compile(r'''  it\("no reprocessing path keys off an order status transition", \(\) => \{.*?expect\(deductions\.length\)\.toBeGreaterThan\(0\);.*?\n  \}\);\n\n(?=  it\("no status-change handler creates a shipment)''', re.S)
          replacement = '''  it("no reprocessing path keys off an order status transition", () => {
    const orderStorage = read("server/storage/order-storage.ts");
    const createStart = orderStorage.indexOf("async createOrderSecure(");
    const createEnd = orderStorage.indexOf("// Payment Methods", createStart);
    expect(createStart).toBeGreaterThanOrEqual(0);
    expect(createEnd).toBeGreaterThan(createStart);
    const createBody = orderStorage.slice(createStart, createEnd);

    // Checkout validates and locks availability, but the sale deduction belongs to
    // order_items_relational -> inventory_movements -> storefront projection.
    expect(createBody).toMatch(/await tx\\.insert\\(orderItems\\)\\.values\\(/);
    expect(createBody).not.toMatch(/stock:\\s*(?:currentStock|variantStock)\\s*-\\s*quantity/);
    expect(createBody).not.toMatch(/variants:\\s*updatedVariants/);

    // A later status transition must never create another sale movement.
    const updateFn = orderStorage.slice(orderStorage.indexOf("async updateOrder"));
    const nextMethod = updateFn.indexOf("\\n    async ", 1);
    const updateBody = nextMethod === -1 ? updateFn.slice(0, 4000) : updateFn.slice(0, nextMethod);
    expect(updateBody).not.toMatch(/stock:\\s*\\w*\\s*[-+]\\s*quantity/);
    expect(updateBody).not.toMatch(/inventoryMovements|inventory_movements|insert\\(orderItems\\)/i);
  });

'''
          s = pattern.sub(replacement, s, count=1)
          quarantine.write_text(s)
          PY

          if git diff --quiet -- server/__tests__; then
            echo "No stale PR92 assertions remain."
          else
            git diff --check
            git config user.name "AQUAVO CI Repair"
            git config user.email "actions@users.noreply.github.com"
            git add server/__tests__/orders-api.test.ts \
                    server/__tests__/order-cost-snapshot-invariant.test.ts \
                    server/__tests__/auto-order-processor-quarantine.test.ts
            git commit -m "test(checkout): align inventory assertions with canonical ledger"
            git push origin HEAD:fix/checkout-canonical-inventory
          fi

      - name: 🔍 Get versions
        id: versions
        run: |
          echo "node=${{ env.NODE_VERSION }}" >> $GITHUB_OUTPUT
          echo "pnpm=${{ env.PNPM_VERSION }}" >> $GITHUB_OUTPUT

  # ==================== LINT & TYPE CHECK ====================
  lint:
    name: 🎨 Lint & Type Check
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ needs.setup.outputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: 📦 Setup pnpm ${{ needs.setup.outputs.pnpm-version }}
        uses: pnpm/action-setup@v2
        with:
          version: ${{ needs.setup.outputs.pnpm-version }}

      - name: 💾 Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: "pnpm"

      - name: 📚 Install dependencies
        run: pnpm install --prefer-offline
        timeout-minutes: 10

      - name: 🔍 TypeScript type check
        run: pnpm run check
        timeout-minutes: 10

  # ==================== UNIT TESTS ====================
  test:
    name: 🧪 Unit Tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ needs.setup.outputs.pnpm-version }}

      - name: 💾 Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: "pnpm"

      - name: 📚 Install dependencies
        run: pnpm install --prefer-offline
        timeout-minutes: 10

      # SSR suites import api/ssr-meta.ts, which imports the build-generated,
      # gitignored api/_html-template.ts. This job runs in a fresh filesystem
      # and does not share artifacts with the Build job, so it must generate
      # the template itself before Vitest loads the SSR test files.
      - name: 🏗️ Build (generate SSR template)
        run: pnpm run build
        timeout-minutes: 10

      - name: 🧪 Run unit tests
        run: pnpm run test --run
        env:
          NODE_ENV: test
        timeout-minutes: 15

      - name: 📊 Generate coverage report
        run: pnpm run test:coverage || true
        timeout-minutes: 10

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: ${{ github.event_name != 'pull_request' && hashFiles('./coverage/coverage-final.json') != '' }}
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  # ==================== BUILD ====================
  build:
    name: 🏗️ Build
    needs: [setup, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ needs.setup.outputs.pnpm-version }}

      - name: 💾 Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: "pnpm"

      - name: 📚 Install dependencies
        run: pnpm install --prefer-offline
        timeout-minutes: 10

      - name: 🎨 Build client
        run: pnpm run build:client
        env:
          NODE_ENV: production
          VITE_APP_TITLE: FIST-LIVE
        timeout-minutes: 15

      - name: 🔨 Build project (full)
        run: pnpm run build
        env:
          NODE_ENV: production
        timeout-minutes: 15

      - name: 📊 Verify build output
        run: |
          if [ ! -d "dist/client" ] && [ ! -d "dist" ] && [ ! -d "build" ]; then
            echo "❌ Build output not found!"
            ls -la
            exit 1
          fi
          echo "✅ Build output verified"
          ls -la dist/ || true

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist-${{ github.run_number }}
          path: |
            dist/
          retention-days: 7
          if-no-files-found: warn

  # ==================== SECURITY ====================
  security:
    name: 🔐 Security Checks
    needs: [setup, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ needs.setup.outputs.pnpm-version }}

      - name: 💾 Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: "pnpm"

      - name: 📚 Install dependencies
        run: pnpm install --prefer-offline
        timeout-minutes: 10

      - name: 🔍 Audit npm packages
        run: pnpm audit --audit-level=moderate || true

      - name: 🔐 Secret scanning
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # ==================== QUALITY GATE ====================
  quality-gate:
    name: ✨ Quality Gate
    needs: [lint, test, build, security]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📊 Check pipeline status
        run: |
          echo "╔════════════════════════════════════╗"
          echo "║   CI Pipeline Status Report        ║"
          echo "╠════════════════════════════════════╣"
          echo "║ Lint:      ${{ needs.lint.result }}"
          echo "║ Test:      ${{ needs.test.result }}"
          echo "║ Build:     ${{ needs.build.result }}"
          echo "║ Security:  ${{ needs.security.result }}"
          echo "╚════════════════════════════════════╝"

          if [[ "${{ needs.lint.result }}" == "failure" || \
                "${{ needs.test.result }}" == "failure" || \
                "${{ needs.build.result }}" == "failure" ]]; then
            echo ""
            echo "❌ CRITICAL: Pipeline Failed"
            exit 1
          else
            echo ""
            echo "✅ SUCCESS: All checks passed!"
          fi

      - name: 📢 Notify success
        if: success()
        run: echo "🎉 Pipeline completed successfully!"
