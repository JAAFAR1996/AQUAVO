name: Blue Dragon Stone Production Image Sync

on:
  push:
    branches: [main]
    paths:
      - "script/sync-blue-dragon-images.ts"
      - ".github/workflows/blue-dragon-images-production-sync.yml"

permissions:
  contents: read

concurrency:
  group: blue-dragon-images-production-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Blue Dragon Stone images into products table
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec tsx script/sync-blue-dragon-images.ts
