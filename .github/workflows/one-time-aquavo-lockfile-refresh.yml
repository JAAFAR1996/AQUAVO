name: One-time AQUAVO security lockfile regeneration

on:
  push:
    branches:
      - feature/volcanic-size-options-20261024

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message == 'chore(security): request targeted lockfile refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact authorized branch
        uses: actions/checkout@v4
        with:
          ref: feature/volcanic-size-options-20261024
          persist-credentials: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Regenerate lockfile from reviewed manifest without running dependency scripts
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Verify lockfile and stage only regenerated manifest resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'No lockfile changes; nothing to push.'
            exit 0
          fi
          git commit -m 'chore(security): regenerate lockfile for patched dependencies'
          git push origin HEAD:feature/volcanic-size-options-20261024
