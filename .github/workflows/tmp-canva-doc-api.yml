name: Temp Canva Document API
on:
  push:
    branches: [tmp/canva-doc-api]
    paths: ['.github/workflows/tmp-canva-doc-api.yml']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and store 1254px hero via Git Data API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          URL='https://media.canva.com/v2/document-image/hash:-2092872343/height:1254/id:DAHT0FjtvDM/type:B/width:1254?brand=BAEkRcTPLAc&csig=AAAAAAAAAAAAAAAAAAAAABJPrGoZ2C5oCc6abfv2Kom_2i2fg26cMJ-IgpMSGuk5&disableexport=T&exp=1788143398&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FjtvDM%2FDAHT0FjtvDM%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260830%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260830T213912Z%26X-Amz-Expires%3D17446%26X-Amz-Signature%3D3129fcfb65608042ae34975c07d984aad265a0bcc0feab52772808a4d61bc065%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DMon%252C%252031%2520Aug%25202026%252002%253A29%253A58%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAACzu9gVmBnhZKbTqEJCmxgRgpAFywH27dbos1REv1QxC&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1'
          curl -L --fail --retry 2 -o /tmp/hero.png "$URL"
          INFO=$(file /tmp/hero.png)
          echo "$INFO"
          echo "$INFO" | grep -q '1254 x 1254'
          test $(wc -c < /tmp/hero.png) -gt 50000
          B64=$(base64 -w0 /tmp/hero.png)
          BLOB=$(jq -n --arg content "$B64" '{content:$content,encoding:"base64"}' | gh api --method POST repos/${GITHUB_REPOSITORY}/git/blobs --input - --jq .sha)
          HEAD=$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/tmp/canva-doc-api --jq .object.sha)
          TREE=$(gh api repos/${GITHUB_REPOSITORY}/git/commits/$HEAD --jq .tree.sha)
          NEWTREE=$(jq -n --arg base "$TREE" --arg blob "$BLOB" '{base_tree:$base,tree:[{path:"tmp/canva-doc-api/hero.png",mode:"100644",type:"blob",sha:$blob}]}' | gh api --method POST repos/${GITHUB_REPOSITORY}/git/trees --input - --jq .sha)
          COMMIT=$(jq -n --arg message 'test: capture 1254px Canva hero' --arg tree "$NEWTREE" --arg parent "$HEAD" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST repos/${GITHUB_REPOSITORY}/git/commits --input - --jq .sha)
          jq -n --arg sha "$COMMIT" '{sha:$sha,force:false}' | gh api --method PATCH repos/${GITHUB_REPOSITORY}/git/refs/heads/tmp/canva-doc-api --input -
