name: Temporary Al-Qaseh v2 token verification fix Node24

on:
  push:
    branches:
      - fix/alqaseh-v2-token-verification

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[alqaseh-v2-token-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alqaseh-v2-token-verification
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Reuse the reviewed patch script from the first temporary workflow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/tmp-alqaseh-v2-token-fix.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, '<alqaseh-v2-patch>', 'exec'))
          PY
      - name: Run focused payment tests
        run: pnpm exec vitest run server/__tests__/alqaseh-client.test.ts server/__tests__/alqaseh-payment-flow.test.ts server/__tests__/alqaseh-accounting.test.ts
      - name: Check changed payment TypeScript diagnostics
        shell: bash
        run: |
          set +e
          pnpm exec tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            if grep -E 'server/(services/alqaseh|routes/alqaseh|__tests__/alqaseh)' /tmp/tsc.log; then
              exit 1
            fi
            echo "Only pre-existing unrelated TypeScript diagnostics remain."
          fi
      - name: Production build
        run: pnpm run build
      - name: Commit verified patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/services/alqaseh-client.ts server/services/alqaseh-order-payment.ts server/routes/alqaseh.ts server/__tests__/alqaseh-client.test.ts server/__tests__/alqaseh-payment-flow.test.ts
          git commit -m "fix(payment): align Al-Qaseh status verification with v2 token API [alqaseh-v2-token-fix]"
          git push origin HEAD:fix/alqaseh-v2-token-verification
