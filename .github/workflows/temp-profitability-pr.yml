name: Temporary profitability PR patch

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/profitability-truth-clean-ui-20260821'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fix
        run: python .github/scripts/temp_profitability_fix.py
      - name: Remove temporary automation
        run: |
          rm -f .github/workflows/temp-profitability-fix.yml
          rm -f .github/workflows/temp-profitability-pr.yml
          rm -f .github/scripts/temp_profitability_fix.py
      - name: Commit and push
        run: |
          git config user.name "AQUAVO Fix Bot"
          git config user.email "138117801+JAAFAR1996@users.noreply.github.com"
          git add -A
          git commit -m "Fix profitability truth and simplify order cost UI"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
