name: 🚀 CI - Build & Test Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: 20.19.0
  PNPM_VERSION: 10.0.0
  CI: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== VALIDATION ====================
  validate:
    name: ✅ Validate & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📚 Install dependencies
        run: pnpm install --prefer-offline
        timeout-minutes: 10

      - name: 🔍 TypeScript type check
        run: pnpm run check
        timeout-minutes: 10

  # ==================== BUILD ====================
  build:
    name: 🏗️ Build
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📚 Install dependencies
        run: pnpm install --prefer-offline
        timeout-minutes: 10

      - name: 🎨 Build client (Vite)
        run: pnpm run build:client
        env:
          NODE_ENV: production
          VITE_APP_TITLE: FIST-LIVE
        timeout-minutes: 10

      - name: 🔨 Build project (full build)
        run: pnpm run build
        env:
          NODE_ENV: production
        timeout-minutes: 10

      - name: 📊 Check build output
        run: |
          if [ ! -d "dist/client" ] && [ ! -d "dist" ] && [ ! -d "build" ]; then
            echo "❌ Build output not found!"
            ls -la
            exit 1
          fi
          echo "✅ Build output verified"
          ls -la dist/ || true

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist-${{ github.run_number }}
          path: |
            dist/
          retention-days: 7
          if-no-files-found: warn

  # ==================== TESTS ====================
  test:
    name: 🧪 Tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📚 Install dependencies
        run: pnpm install --prefer-offline
        timeout-minutes: 10

      # SSR suites import api/ssr-meta.ts, which imports the build-generated,
      # gitignored api/_html-template.ts. This job runs in a fresh filesystem
      # and does not share artifacts with the Build job, so it must generate
      # the template itself before Vitest loads the SSR test files.
      - name: 🏗️ Build (generate SSR template)
        run: pnpm run build
        timeout-minutes: 10

      - name: 🧪 Run unit tests (Vitest)
        run: pnpm run test --run
        env:
          NODE_ENV: test
        timeout-minutes: 10

      - name: 📊 Generate coverage report
        run: pnpm run test:coverage
        continue-on-error: true
        timeout-minutes: 10

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-report
          fail_ci_if_error: false
          verbose: false

  # ==================== SECURITY ====================
  security:
    name: 🔐 Security Checks
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📚 Install dependencies
        run: pnpm install --prefer-offline
        timeout-minutes: 10

      - name: 🔍 Audit npm packages (moderate)
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: 🔐 Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

  # ==================== COMPLETION ====================
  pipeline-status:
    name: ✨ Pipeline Status
    needs: [validate, build, test, security]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📊 Check pipeline status
        run: |
          VALIDATE_STATUS="${{ needs.validate.result }}"
          BUILD_STATUS="${{ needs.build.result }}"
          TEST_STATUS="${{ needs.test.result }}"
          SECURITY_STATUS="${{ needs.security.result }}"

          echo "╔════════════════════════════════════╗"
          echo "║   CI Pipeline Execution Report     ║"
          echo "╠════════════════════════════════════╣"
          echo "║ Validate:  $VALIDATE_STATUS"
          echo "║ Build:     $BUILD_STATUS"
          echo "║ Test:      $TEST_STATUS"
          echo "║ Security:  $SECURITY_STATUS"
          echo "╚════════════════════════════════════╝"

          # Only fail on actual failures, not on skipped jobs
          FAILED=false
          if [[ "$VALIDATE_STATUS" == "failure" ]]; then
            echo "❌ Validate job failed"
            FAILED=true
          fi
          if [[ "$BUILD_STATUS" == "failure" ]]; then
            echo "❌ Build job failed"
            FAILED=true
          fi
          if [[ "$TEST_STATUS" == "failure" ]]; then
            echo "❌ Test job failed"
            FAILED=true
          fi

          if [[ "$FAILED" == "true" ]]; then
            echo ""
            echo "❌ CRITICAL: Pipeline Failed"
            exit 1
          else
            echo ""
            echo "✅ SUCCESS: All essential checks passed!"
          fi

      - name: 📢 Notify success
        if: success()
        run: echo "🎉 Pipeline completed successfully!"
