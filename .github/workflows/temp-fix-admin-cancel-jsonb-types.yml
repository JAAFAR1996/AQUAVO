name: Temporary admin-cancel JSONB type fix runner

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch-jsonb-types:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/admin-cancel-jsonb-types'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply reviewed patch
        run: python scripts/fix-admin-cancel-jsonb-types.py

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/fix-admin-cancel-jsonb-types.py
          git add server/routes/admin-orders-v2.ts server/services/__tests__/alqaseh-admin-cancellation-contract.test.ts
          git commit -m "fix: cast admin cancellation jsonb parameters"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
