name: Correct FH-260922-1713B1F6 delivery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/correct-fh-260922-1713b1f6.yml"

permissions:
  contents: read

concurrency:
  group: correct-fh-260922-1713b1f6
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Correct order status, stock, and false return
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;

          DO $guard$
          DECLARE
            v_id text;
            v_status text;
            v_fact_count integer;
            v_reversal_count integer;
            v_return_status text;
            v_restocked boolean;
          BEGIN
            SELECT id,status INTO v_id,v_status
            FROM public.orders
            WHERE order_number='FH-260922-1713B1F6'
            FOR UPDATE;

            IF v_id IS NULL THEN
              RAISE EXCEPTION 'ORDER_NOT_FOUND';
            END IF;

            -- Idempotent success if this workflow already completed.
            IF v_status='delivered' THEN
              RETURN;
            END IF;

            IF v_status<>'returned' THEN
              RAISE EXCEPTION 'UNEXPECTED_ORDER_STATUS: %',v_status;
            END IF;

            SELECT count(*) INTO v_fact_count
            FROM public.order_accounting_facts
            WHERE order_id=v_id;

            IF v_fact_count<>0 THEN
              RAISE EXCEPTION 'UNEXPECTED_ACCOUNTING_FACT_COUNT_BEFORE_CORRECTION: %',v_fact_count;
            END IF;

            SELECT count(*) INTO v_reversal_count
            FROM public.inventory_movements
            WHERE source_type='order_status_reversal'
              AND source_id=v_id;

            IF v_reversal_count<>5 THEN
              RAISE EXCEPTION 'UNEXPECTED_REVERSAL_COUNT: %',v_reversal_count;
            END IF;

            SELECT status,restocked
              INTO v_return_status,v_restocked
            FROM public.order_return_events
            WHERE order_id=v_id
              AND type='rejected_delivery'
              AND reason='AUTO_ORDER_STATUS_REJECTED'
            ORDER BY created_at DESC
            LIMIT 1;

            IF v_return_status IS DISTINCT FROM 'recorded'
               OR COALESCE(v_restocked,false)<>true THEN
              RAISE EXCEPTION
                'UNEXPECTED_RETURN_EVENT_STATE: status=% restocked=%',
                v_return_status,v_restocked;
            END IF;
          END
          $guard$;

          -- Undo only the stock that was incorrectly restored by the false rejection.
          INSERT INTO public.inventory_movements(
            product_id,variant_id,location_id,quantity_delta,
            movement_type,source_type,source_id,idempotency_key,
            unit_cost,currency,happened_at,created_by,metadata,reversed_movement_id
          )
          SELECT
            im.product_id,
            im.variant_id,
            im.location_id,
            -im.quantity_delta,
            'manual_adjustment',
            'owner_order_status_correction',
            im.source_id,
            'owner-order-status-correction:'||im.id,
            im.unit_cost,
            COALESCE(im.currency,'IQD'),
            clock_timestamp(),
            'owner:Jaafar',
            jsonb_build_object(
              'order_number','FH-260922-1713B1F6',
              'reason','Customer actually received order; undo false rejected/returned stock restoration',
              'original_reversal_movement_id',im.id
            ),
            im.id
          FROM public.inventory_movements im
          JOIN public.orders o ON o.id=im.source_id
          WHERE o.order_number='FH-260922-1713B1F6'
            AND im.source_type='order_status_reversal'
          ON CONFLICT(idempotency_key) DO NOTHING;

          -- The automatic return record is false evidence for this real delivery.
          UPDATE public.order_return_events e
          SET status='disputed',
              restocked=false,
              restocked_at=NULL,
              note=concat_ws(
                ' | ',
                NULLIF(e.note,''),
                'تصحيح مالك المتجر: الزبون استلم الطلب فعلياً؛ حالة الرفض/الاسترجاع كانت خاطئة.'
              ),
              updated_at=clock_timestamp()
          FROM public.orders o
          WHERE e.order_id=o.id
            AND o.order_number='FH-260922-1713B1F6'
            AND e.type='rejected_delivery'
            AND e.reason='AUTO_ORDER_STATUS_REJECTED'
            AND e.status='recorded';

          -- Bypass only the two guards that intentionally block reopening a returned
          -- order. Keep delivery-readiness, timestamp, accounting, journal and COGS
          -- triggers active so this becomes a normal delivered order financially.
          ALTER TABLE public.orders
            DISABLE TRIGGER order_financial_history_immutable;
          ALTER TABLE public.orders
            DISABLE TRIGGER orders_reverse_inventory_terminal;

          UPDATE public.orders
          SET status='delivered',
              updated_at=clock_timestamp()
          WHERE order_number='FH-260922-1713B1F6'
            AND status='returned';

          ALTER TABLE public.orders
            ENABLE TRIGGER orders_reverse_inventory_terminal;
          ALTER TABLE public.orders
            ENABLE TRIGGER order_financial_history_immutable;

          DO $verify$
          DECLARE
            v_id text;
            v_status text;
            v_fact_count integer;
            v_correction_count integer;
            v_return_status text;
            v_restocked boolean;
            v_net_qty integer;
          BEGIN
            SELECT id,status INTO v_id,v_status
            FROM public.orders
            WHERE order_number='FH-260922-1713B1F6';

            IF v_status<>'delivered' THEN
              RAISE EXCEPTION 'FINAL_STATUS_NOT_DELIVERED: %',v_status;
            END IF;

            SELECT count(*) INTO v_fact_count
            FROM public.order_accounting_facts
            WHERE order_id=v_id;

            IF v_fact_count<>1 THEN
              RAISE EXCEPTION 'FINAL_ACCOUNTING_FACT_COUNT_INVALID: %',v_fact_count;
            END IF;

            SELECT count(*) INTO v_correction_count
            FROM public.inventory_movements
            WHERE source_type='owner_order_status_correction'
              AND source_id=v_id;

            IF v_correction_count<>5 THEN
              RAISE EXCEPTION 'FINAL_CORRECTION_MOVEMENT_COUNT_INVALID: %',v_correction_count;
            END IF;

            SELECT COALESCE(sum(quantity_delta),0)::integer INTO v_net_qty
            FROM public.inventory_movements
            WHERE source_id=v_id
              AND source_type IN (
                'order_line',
                'order_status_reversal',
                'owner_order_status_correction'
              );

            IF v_net_qty<>-5 THEN
              RAISE EXCEPTION 'FINAL_ORDER_PRODUCT_NET_QTY_INVALID: %',v_net_qty;
            END IF;

            SELECT status,restocked
              INTO v_return_status,v_restocked
            FROM public.order_return_events
            WHERE order_id=v_id
              AND type='rejected_delivery'
              AND reason='AUTO_ORDER_STATUS_REJECTED'
            ORDER BY created_at DESC
            LIMIT 1;

            IF v_return_status IS DISTINCT FROM 'disputed'
               OR COALESCE(v_restocked,false)<>false THEN
              RAISE EXCEPTION
                'FINAL_RETURN_EVENT_NOT_DISPUTED: status=% restocked=%',
                v_return_status,v_restocked;
            END IF;
          END
          $verify$;

          COMMIT;

          SELECT
            o.order_number,
            o.status,
            o.delivered_at,
            (SELECT count(*) FROM public.order_accounting_facts f WHERE f.order_id=o.id) AS accounting_fact_count,
            (SELECT count(*) FROM public.inventory_movements m WHERE m.source_type='owner_order_status_correction' AND m.source_id=o.id) AS correction_movements,
            (SELECT status FROM public.order_return_events e WHERE e.order_id=o.id AND e.type='rejected_delivery' ORDER BY created_at DESC LIMIT 1) AS return_event_status
          FROM public.orders o
          WHERE o.order_number='FH-260922-1713B1F6';
          SQL
