name: One-time order delivery correction

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/correct-fh-260922-1713b1f6.yml"

permissions:
  contents: read

concurrency:
  group: correct-fh-260922-1713b1f6
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Correct order to delivered
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          pnpm exec tsx script/correct-fh-260922-1713b1f6.ts
