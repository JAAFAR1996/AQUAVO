name: Customer Messaging Retry Worker

on:
  schedule:
    # GitHub Actions supports a 5-minute minimum. Offset from :00 to reduce
    # scheduler congestion while keeping retry latency bounded.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: customer-messaging-retry-worker
  cancel-in-progress: false

jobs:
  invoke-production-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Mint short-lived AQUAVO scheduler token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=aquavo-customer-messaging")"
          token="$(printf '%s' "$response" | jq -r '.value // empty')"
          if [ -z "$token" ]; then
            echo "GitHub OIDC token was not issued"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Run protected AQUAVO messaging worker
        env:
          AQUAVO_SCHEDULER_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --max-time 55 \
            --retry 1 \
            --retry-delay 10 \
            --retry-all-errors \
            --header "Authorization: Bearer ${AQUAVO_SCHEDULER_TOKEN}" \
            "https://www.aquavoiq.com/api/cron/customer-messaging"
