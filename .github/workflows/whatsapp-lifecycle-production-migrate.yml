name: WhatsApp Lifecycle Production Migration

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact commit SHA or branch to migrate from"
        required: true
        default: "main"
        type: string
      confirm:
        description: "Type APPLY_WHATSAPP_LIFECYCLE_0095_0097 exactly"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: whatsapp-lifecycle-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirm == 'APPLY_WHATSAPP_LIFECYCLE_0095_0097' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Record release commit
        run: git rev-parse HEAD

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify WhatsApp lifecycle and Wayl accounting contracts
        run: >-
          pnpm exec vitest run
          server/__tests__/alqaseh-accounting-execution.test.ts
          server/__tests__/checkout-whatsapp-consent-contract.test.ts
          server/__tests__/customer-messaging-outbox-contract.test.ts
          server/__tests__/repurchase-pack-measure.test.ts
          server/__tests__/whatsapp-lifecycle-automation-contract.test.ts
          server/__tests__/whatsapp-template-132018-fallback.test.ts
          server/__tests__/whatsapp-webhook.test.ts

      - name: Verify migration ledger governance
        run: pnpm check:migrations

      - name: Verify production build
        run: pnpm build

      - name: Apply 0095-0097
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONFIRM_WHATSAPP_LIFECYCLE_0095_0097: APPLY_WHATSAPP_LIFECYCLE_0095_0097
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          pnpm exec tsx script/apply-0095-0097-whatsapp-lifecycle.ts
