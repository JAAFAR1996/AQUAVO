name: Agent Readiness Live Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/routes/agent-discovery.ts"
      - "server/routes/agent-auth.ts"
      - "server/routes/a2a.ts"
      - "server/routes/oauth.ts"
      - "server/routes/mcp.ts"
      - "client/public/robots.txt"
      - "vercel.json"
      - ".github/workflows/agent-readiness-live.yml"

concurrency:
  group: agent-readiness-live
  cancel-in-progress: true

jobs:
  scan:
    name: Scan aquavoiq.com
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Wait for production agent metadata
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            BODY="$(curl -fsS --max-time 15 https://www.aquavoiq.com/.well-known/oauth-authorization-server || true)"
            if printf '%s' "$BODY" | grep -q '"agent_auth"' && printf '%s' "$BODY" | grep -q '"register_uri"'; then
              exit 0
            fi
            sleep 10
          done
          echo "Production agent_auth metadata did not become reachable." >&2
          exit 1

      - name: Prove external A2A catalog works
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/a2a-smoke

          curl -fsS --max-time 30 \
            https://www.aquavoiq.com/.well-known/agent-card.json \
            -o artifacts/a2a-smoke/agent-card.json

          HTTP_CODE="$(curl -sS --max-time 30 \
            -o artifacts/a2a-smoke/response.json \
            -D artifacts/a2a-smoke/headers.txt \
            -w '%{http_code}' \
            -X POST https://www.aquavoiq.com/api/a2a/message:send \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data '{"message":{"messageId":"github-a2a-smoke","role":"ROLE_USER","parts":[{"text":"Search for YEE"}]}}')"

          echo "A2A HTTP status: $HTTP_CODE"
          cat artifacts/a2a-smoke/response.json
          test "$HTTP_CODE" = "200"

          node <<'NODE'
          const fs = require("node:fs");
          const card = JSON.parse(fs.readFileSync("artifacts/a2a-smoke/agent-card.json", "utf8"));
          const response = JSON.parse(fs.readFileSync("artifacts/a2a-smoke/response.json", "utf8"));
          const headers = fs.readFileSync("artifacts/a2a-smoke/headers.txt", "utf8").toLowerCase();

          if (card.name !== "AQUAVO Catalog Agent") throw new Error("Unexpected A2A Agent Card");
          if (!Array.isArray(card.skills) || !card.skills.some((s) => s.id === "search-products")) {
            throw new Error("search-products skill not advertised");
          }
          if (!headers.includes("a2a-version: 1.0")) throw new Error("Missing A2A-Version: 1.0");

          const message = response.message;
          if (!message || message.role !== "ROLE_AGENT" || !Array.isArray(message.parts)) {
            throw new Error("Invalid A2A agent response");
          }
          const text = message.parts.map((p) => p?.text || "").join("\n");
          if (!text.includes('AQUAVO public catalog matches for "YEE"')) {
            throw new Error("A2A endpoint did not return live YEE catalog matches");
          }
          if (!text.includes("Data above comes from AQUAVO's sanitized public product boundary.")) {
            throw new Error("A2A public-data boundary marker missing");
          }

          console.log("\nA2A EXTERNAL SMOKE TEST: PASS");
          console.log(text);
          NODE

      - name: Run official Agent Readiness scanner
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/agent-readiness
          HTTP_CODE="$(
            curl -sS --max-time 180 \
              -o artifacts/agent-readiness/report.json \
              -w '%{http_code}' \
              -X POST https://isitagentready.com/api/scan \
              -H 'Content-Type: application/json' \
              -H 'User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36' \
              -H 'Referer: https://isitagentready.com/' \
              -H 'Origin: https://isitagentready.com' \
              --data '{"url":"https://www.aquavoiq.com/"}'
          )"
          echo "Scanner HTTP status: $HTTP_CODE"
          cat artifacts/agent-readiness/report.json
          test "$HTTP_CODE" -ge 200
          test "$HTTP_CODE" -lt 300

      - name: Summarize scan
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "artifacts/agent-readiness/report.json";
          if (!fs.existsSync(path)) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "# Agent Readiness\n\nNo scanner report was produced.\n");
            process.exit(0);
          }
          const raw = fs.readFileSync(path, "utf8");
          let data;
          try { data = JSON.parse(raw); } catch {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "# Agent Readiness\n\nScanner response was not JSON.\n");
            process.exit(0);
          }
          const score = data.score ?? data.overallScore ?? data.readinessScore ?? "unknown";
          const level = data.level ?? "unknown";
          const levelName = data.levelName ?? data.level_name ?? "";
          const lines = [
            "# AQUAVO Agent Readiness",
            "",
            "- Score: **" + score + "**",
            "- Level: **" + level + (levelName ? " — " + levelName : "") + "**",
            "- Scanned: **" + new Date().toISOString() + "**",
            "",
            "The complete scanner JSON is attached as a workflow artifact."
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          NODE

      - name: Upload scanner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquavo-agent-readiness-${{ github.run_number }}
          path: |
            artifacts/agent-readiness/report.json
            artifacts/a2a-smoke/
          if-no-files-found: warn
          retention-days: 30
