name: Accounting V2 P0 Completion

on:
  pull_request:
    paths:
      - "TOOLS/complete-accounting-p0.py"
      - ".github/workflows/accounting-v2-ci.yml"
      - ".github/workflows/one-off-return-variant-patch.yml"
      - "migrations/006*.sql"
      - "migrations/007*.sql"
      - "shared/accounting.ts"
      - "client/src/components/admin/order-return-adjustment-modal.tsx"
      - "script/apply-accounting-v2-migrations.ts"
      - "server/routes/accounting-v2.ts"
      - "server/__tests__/accounting-*.test.ts"
      - "vercel.json"

permissions:
  contents: write

concurrency:
  group: accounting-v2-p0-completion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  complete-p0:
    if: github.event.pull_request.head.ref == 'fix/accounting-v2-p0-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout accounting files from exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/accounting-v2-ci.yml
            /.github/workflows/one-off-return-variant-patch.yml
            /TOOLS/complete-accounting-p0.py
            /client/src/components/admin/order-return-adjustment-modal.tsx
            /migrations/*.sql
            /script/apply-accounting-v2-migrations.ts
            /server/routes/accounting-v2.ts
            /server/__tests__/accounting-cod-refusal-migration-contract.test.ts
            /server/__tests__/accounting-customer-credit-posting-links.test.ts
            /server/__tests__/accounting-v2-review-fixes-contract.test.ts
            /server/__tests__/accounting-warranty-refusal-separation.test.ts
            /shared/accounting.ts
            /vercel.json
          persist-credentials: true

      - name: Apply complete P0 patch
        run: python3 TOOLS/complete-accounting-p0.py

      - name: Commit completed implementation
        shell: bash
        run: |
          git checkout -- .github/workflows/accounting-v2-ci.yml .github/workflows/one-off-return-variant-patch.yml
          rm TOOLS/complete-accounting-p0.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A
          git commit -m "fix(accounting): complete P0 return and deployment integrity"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
