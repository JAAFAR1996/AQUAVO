name: Temp Build Blue Dragon Real Gallery

on:
  push:
    branches: [tmp/canva-fullres-v4]
    paths:
      - ".github/workflows/tmp-build-blue-dragon-real-gallery.yml"
      - "tmp/blue-upload/hero/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staged source branch
        uses: actions/checkout@v4
        with:
          ref: tmp/canva-fullres-v4
          fetch-depth: 1

      - name: Reconstruct and verify exact source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          d=Path('tmp/blue-upload/hero')
          parts={p.name:p.read_text().replace('\n','').replace('\r','') for p in sorted(d.glob('part*.txt'))}
          target_b64_sha='f02164d1edc8b7dd29c21fc5b80230e21b951c51b29db6c3f6cc9992205eeb4e'
          target_bytes_sha='91acb9e9d18f76a1a74d217291544ed1be6e7d7784e8df6244915230c89d8368'
          s=''.join(parts[k] for k in sorted(parts))

          if hashlib.sha256(s.encode()).hexdigest()!=target_b64_sha:
              # One transfer character was accidentally duplicated in part006.
              bad=parts['part006.txt']
              fixed=None
              for i in range(len(bad)):
                  candidate=bad[:i]+bad[i+1:]
                  full=''.join(candidate if k=='part006.txt' else parts[k] for k in sorted(parts))
                  if hashlib.sha256(full.encode()).hexdigest()==target_b64_sha:
                      fixed=full
                      print('repaired_duplicate_at_part006_index',i)
                      break
              if fixed is None:
                  raise SystemExit('staged source does not match verified source checksum')
              s=fixed

          data=base64.b64decode(s,validate=True)
          if hashlib.sha256(data).hexdigest()!=target_bytes_sha:
              raise SystemExit('decoded source checksum mismatch')
          Path('/tmp/blue-dragon-source.webp').write_bytes(data)
          print('verified_source_bytes',len(data))
          PY

      - name: Build truth-preserving gallery
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          src=Path('/tmp/blue-dragon-source.webp')
          im=Image.open(src); im.load()
          if im.format!='WEBP': raise SystemExit(f'Expected WEBP, got {im.format}')
          if min(im.size)<700: raise SystemExit(f'Source too small: {im.size}')
          im=im.convert('RGB')

          out=Path('/tmp/blue-dragon-gallery'); out.mkdir(parents=True,exist_ok=True)
          hero=ImageOps.pad(im,(1200,1200),method=Image.Resampling.LANCZOS,color=(246,246,244),centering=(0.5,0.5))
          hero.save(out/'blue-dragon-stone-hero.webp','WEBP',quality=90,method=6)

          w,h=im.size
          detail=im.crop((int(w*.18),int(h*.18),int(w*.82),int(h*.82)))
          detail=ImageOps.fit(detail,(1200,1200),method=Image.Resampling.LANCZOS,centering=(.5,.5))
          detail.save(out/'blue-dragon-stone-detail.webp','WEBP',quality=90,method=6)

          batch=im.crop((int(w*.08),int(h*.08),int(w*.92),int(h*.92)))
          batch=ImageOps.fit(batch,(1200,1200),method=Image.Resampling.LANCZOS,centering=(.5,.5))
          batch.save(out/'blue-dragon-stone-batch.webp','WEBP',quality=88,method=6)

          print('source',im.size,src.stat().st_size)
          for p in sorted(out.glob('*.webp')):
              c=Image.open(p); c.load(); print(p.name,c.size,p.stat().st_size)
          PY

      - name: Publish gallery to clean feature branch
        env:
          BRANCH: feat/blue-dragon-real-gallery-20260831
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AQUAVO Automation"
          git config user.email "138117801+JAAFAR1996@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          mkdir -p client/public/products/houyi-blue-dragon-stone
          cp /tmp/blue-dragon-gallery/*.webp client/public/products/houyi-blue-dragon-stone/
          git add client/public/products/houyi-blue-dragon-stone/
          git commit -m "feat(products): add real Blue Dragon Stone gallery"
          git push --force-with-lease origin "$BRANCH"
