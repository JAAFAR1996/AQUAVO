name: SEO Preview Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "api/_canonical-guides.ts"
      - "api/_guides-content.ts"
      - "api/_seo-preview-shell.tsx"
      - "api/_seo-structured-data.ts"
      - "api/_ssr-preview-source.ts"
      - "api/index.ts"
      - "api/robots.ts"
      - "api/sitemap-index.ts"
      - "api/sitemap-pages.ts"
      - "api/sitemap-products.ts"
      - "api/sitemap-guides.ts"
      - "api/ssr-preview.ts"
      - "api/ssr-preview-advanced.ts"
      - "generated/ssr-preview-runtime.d.ts"
      - "script/build.ts"
      - "client/public/robots.txt"
      - "client/public/sitemap-recovery.xml"
      - "client/public/67d3eed08e869c3cd18bdf563d183fcc.txt"
      - "client/src/components/seo/meta-tags.tsx"
      - "client/src/main.tsx"
      - "shared/seo-contract.ts"
      - "shared/site-routes.ts"
      - "reports/release-2026-07-12/seo-aeo-geo-query-map.md"
      - "test/seo-preview-shell.test.tsx"
      - "test/seo-runtime-entry.test.ts"
      - "test/seo-production-safety.test.ts"
      - "scripts/verify-generated-ssr-runtime.ts"
      - "TOOLS/submit-indexnow.mjs"
      - "TOOLS/indexnow-core.mjs"
      - "scripts/seo-preview-live-audit.mjs"
      - "scripts/seo-preview-visual-parity.mjs"
      - "scripts/seo-production-360-audit.mjs"
      - ".lighthouserc.preview.cjs"
      - "docs/seo/SSR_MIGRATION_DECISION.md"
      - "docs/seo/SEARCH_INDEX_RECOVERY_2026-08-04.md"
      - "vercel.json"
      - ".github/workflows/indexnow-search-refresh.yml"
      - ".github/workflows/seo-preview-validation.yml"
      - ".github/workflows/seo-preview-live-validation.yml"
      - ".github/workflows/seo-production-360-audit.yml"
  workflow_dispatch:

concurrency:
  group: seo-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-html:
    name: Semantic HTML Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Type-check application and SEO functions
        run: pnpm run check

      - name: Build generated SSR template and server bundle
        run: pnpm run build

      - name: Verify SSR runtime generation is clean and ordered
        run: |
          test -f generated/ssr-preview-runtime.js
          git diff --exit-code -- api/ssr-preview.ts
          git diff --exit-code -- api/_ssr-preview-source.ts

      - name: Execute generated semantic runtime
        run: pnpm exec tsx scripts/verify-generated-ssr-runtime.ts

      - name: Run focused SEO HTML, schema, route, and safety tests
        run: pnpm exec vitest run test/seo-preview-shell.test.tsx test/seo-runtime-entry.test.ts test/seo-production-safety.test.ts --reporter=verbose

      - name: Verify IndexNow submission syntax
        run: |
          node --check TOOLS/submit-indexnow.mjs
          node --check TOOLS/indexnow-core.mjs

      - name: Verify browser-audit script syntax
        run: node --check scripts/seo-preview-live-audit.mjs

      - name: Verify visual-parity script syntax
        run: node --check scripts/seo-preview-visual-parity.mjs

      - name: Verify production 360 audit syntax
        run: node --check scripts/seo-production-360-audit.mjs

      - name: Verify Lighthouse config syntax
        env:
          PREVIEW_URL: https://preview.invalid
        run: node -e "require('./.lighthouserc.preview.cjs')"
