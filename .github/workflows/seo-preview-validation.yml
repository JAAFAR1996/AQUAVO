name: SEO Preview Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "api/_seo-preview-shell.tsx"
      - "api/_seo-structured-data.ts"
      - "api/ssr-preview.ts"
      - "api/ssr-preview-advanced.ts"
      - "test/seo-preview-shell.test.tsx"
      - "scripts/seo-preview-live-audit.mjs"
      - "scripts/seo-preview-visual-parity.mjs"
      - ".lighthouserc.preview.cjs"
      - "docs/seo/SSR_MIGRATION_DECISION.md"
      - "vercel.json"
      - ".github/workflows/seo-preview-validation.yml"
      - ".github/workflows/seo-preview-live-validation.yml"
  workflow_dispatch:

concurrency:
  group: seo-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-html:
    name: Semantic HTML Contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Type-check preview files
        run: pnpm run check

      - name: Run focused SSR HTML and structured-data tests
        run: pnpm exec vitest run test/seo-preview-shell.test.tsx --reporter=verbose

      - name: Verify browser-audit script syntax
        run: node --check scripts/seo-preview-live-audit.mjs

      - name: Verify visual-parity script syntax
        run: node --check scripts/seo-preview-visual-parity.mjs

      - name: Verify Lighthouse config syntax
        env:
          PREVIEW_URL: https://preview.invalid
        run: node -e "require('./.lighthouserc.preview.cjs')"
