              1,
          )
          replace_required(
              "client/src/components/navbar.tsx",
              "الدفع عند الاستلام — التوصيل 5,000 د.ع",
              "الدفع عند الاستلام أو إلكترونياً — التوصيل 5,000 د.ع",
              1,
          )

          # Terms: both methods, with gateway verification semantics.
          replace_required(
              "client/src/pages/terms.tsx",
              '         "الدفع نقداً عند الاستلام (COD) — تدفع فقط عند وصول الطلب",\n         "المبلغ يُقرّب لأقرب 250 د.ع — فرق التقريب يُحفظ كرصيد بحسابك",\n         "الفاتورة الإلكترونية تُرسل تلقائياً مع تأكيد الطلب",\n         "يُرجى تحضير المبلغ المحدد لتسهيل عملية الاستلام",',
              '         "يمكنك اختيار الدفع نقداً عند الاستلام (COD) أو الدفع الإلكتروني من صفحة إكمال الطلب",\n         "في الدفع الإلكتروني لا يُعتبر الطلب مدفوعاً إلا بعد تأكيد حالة العملية من بوابة الدفع على السيرفر",\n         "المبلغ يُقرّب لأقرب 250 د.ع — فرق التقريب يُحفظ كرصيد بحسابك",\n         "الفاتورة الإلكترونية تُرسل تلقائياً مع تأكيد الطلب",\n         "إذا اخترت الدفع عند الاستلام، يُرجى تحضير المبلغ المحدد لتسهيل عملية الاستلام",',
              1,
