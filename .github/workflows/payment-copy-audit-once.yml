              'text: "نشارك الحد اللازم مع مزودي الاستضافة وقاعدة البيانات والتخزين والتوصيل والتحليلات وخدمات الأمان، ومع بوابة الدفع عند اختيار الدفع الإلكتروني، أو عند وجود طلب قانوني ملزم. قد نخزن معرّف عملية الدفع والمبلغ والحالة اللازمة لمتابعة الطلب، بدون تخزين بيانات البطاقة الحساسة. الوصول الإداري لازم يبقى محدوداً حسب الحاجة.",',
              1,
          )
          replace_required("client/src/pages/privacy-policy.tsx", "آخر تحديث: 12 تموز 2026", "آخر تحديث: 25 آب 2026", 1)

          replace_required(
