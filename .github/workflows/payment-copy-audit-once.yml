name: Payment copy audit (one-time)

on:
  push:
    branches:
      - codex/payment-copy-audit

permissions:
  contents: write

jobs:
  update-payment-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update COD-only copy and payment-aware invoice UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = set()

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
              changed.add(path)

          def replace_required(path, old, new, count=None):
              text = read(path)
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f"required text not found in {path}: {old[:100]!r}")
              if count is not None and found != count:
                  raise SystemExit(f"unexpected match count in {path}: {found} != {count} for {old[:100]!r}")
              write(path, text.replace(old, new))

          def replace_if_present(path, old, new):
              text = read(path)
              if old in text:
                  write(path, text.replace(old, new))

          def modernize_generic_payment_copy(path):
              text = read(path)
              original = text
              # Most-specific legacy claims first.
              replacements = [
                  ("الدفع نقداً عند الاستلام فقط", "الدفع عند الاستلام أو إلكترونياً"),
                  ("الدفع نقدًا عند الاستلام فقط", "الدفع عند الاستلام أو إلكترونياً"),
                  ("الدفع عند الاستلام فقط", "الدفع عند الاستلام أو إلكترونياً"),
                  ("دفع عند الاستلام فقط", "دفع عند الاستلام أو إلكترونياً"),
                  ("الدفع نقداً عند الاستلام", "الدفع عند الاستلام أو إلكترونياً"),
                  ("الدفع نقدًا عند الاستلام", "الدفع عند الاستلام أو إلكترونياً"),
              ]
              for old, new in replacements:
                  text = text.replace(old, new)
              text = re.sub(r"الدفع عند الاستلام(?! أو إلكترونياً| أو الدفع الإلكتروني)", "الدفع عند الاستلام أو إلكترونياً", text)
              text = re.sub(r"(?<!ال)دفع عند الاستلام(?! أو إلكترونياً| أو الدفع الإلكتروني)", "دفع عند الاستلام أو إلكترونياً", text)
              text = text.replace("أو إلكترونياً أو إلكترونياً", "أو إلكترونياً")
              if text != original:
                  write(path, text)

          # Checkout first-step summary must not imply COD is already selected.
          replace_required(
              "client/src/components/cart/checkout/order-summary.tsx",
              "<span>الدفع عند الاستلام</span>",
              "<span>الدفع عند الاستلام أو إلكترونياً</span>",
              1,
          )

          # Public trust / policy pages.
          replace_required(
              "client/src/pages/faq.tsx",
              '{ question: "شلون أدفع؟", answer: "الدفع نقداً عند الاستلام فقط. ماكو دفع إلكتروني مفعّل هسه." },',
              '{ question: "شلون أدفع؟", answer: "تگدر تدفع نقداً عند الاستلام، أو إلكترونياً من خلال بوابة الدفع أثناء إكمال الطلب. بيانات بطاقتك تدخل ببوابة الدفع وما يخزنها AQUAVO." },',
              1,
          )
          replace_required(
              "client/src/pages/faq.tsx",
              'description="أجوبة واضحة عن منتجات AQUAVO، التوصيل خلال 24 ساعة، أجرة 5,000 د.ع، الدفع عند الاستلام، ومشاكل الاستلام."',
              'description="أجوبة واضحة عن منتجات AQUAVO، التوصيل خلال 24 ساعة، أجرة 5,000 د.ع، الدفع عند الاستلام أو إلكترونياً، ومشاكل الاستلام."',
              1,
          )

          replace_required(
              "client/src/pages/shipping.tsx",
              '{ icon: Banknote, title: "الدفع عند الاستلام", detail: "نقداً عند وصول الطلب" },',
              '{ icon: Banknote, title: "طرق دفع مرنة", detail: "عند الاستلام أو إلكترونياً" },',
              1,
          )
          replace_required(
              "client/src/pages/shipping.tsx",
              'description="توصيل AQUAVO لكل العراق خلال 24 ساعة بأجرة ثابتة 5,000 د.ع والدفع نقداً عند الاستلام."',
              'description="توصيل AQUAVO لكل العراق خلال 24 ساعة بأجرة ثابتة 5,000 د.ع، مع الدفع عند الاستلام أو إلكترونياً."',
              1,
          )
          replace_required(
              "client/src/pages/shipping.tsx",
              'أجرة التوصيل 5,000 د.ع، والدفع نقداً عند الاستلام. تشوف المبلغ كاملاً قبل تأكيد الطلب.',
              'أجرة التوصيل 5,000 د.ع، وتگدر تختار الدفع عند الاستلام أو الدفع الإلكتروني أثناء إكمال الطلب. تشوف المبلغ كاملاً قبل التأكيد.',
              1,
