              "api/_seo-preview-shell.tsx",
              "api/_ssr-preview-source.ts",
              "api/_guides-content.ts",
          ]
          for path in generic_files:
              modernize_generic_payment_copy(path)

          replace_required(
              "shared/seo-contract.ts",
              'export const AQUAVO_SEO_RELEASE_LASTMOD = "2026-08-04";',
              'export const AQUAVO_SEO_RELEASE_LASTMOD = "2026-08-25";',
