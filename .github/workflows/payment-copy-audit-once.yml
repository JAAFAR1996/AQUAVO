              "client/src/components/cart/invoice-dialog.tsx",
              '<span className="text-lg font-semibold">💵 تدفع نقداً:</span>\n                  <div className="text-left">\n                    <p className="text-2xl font-bold text-primary">{formatIQD(actualPayAmount)}</p>\n                    <p className="payment-method text-xs text-muted-foreground">الدفع عند الاستلام</p>',
              '<span className="text-lg font-semibold">{isOnlinePayment ? "✅ مدفوع إلكترونياً:" : "💵 تدفع نقداً:"}</span>\n                  <div className="text-left">\n                    <p className="text-2xl font-bold text-primary">{formatIQD(actualPayAmount)}</p>\n                    <p className="payment-method text-xs text-muted-foreground">{paymentMethodLabel}</p>',
              1,
          )
          replace_if_present("client/src/components/cart/invoice-dialog.tsx", "// المبلغ اللي يدفعه نقداً = roundedTotal مباشرة (الكاش باك مخصوم قبل التقريب)", "// المبلغ النهائي للفاتورة؛ طريقة الدفع تُعرض حسب الطلب الفعلي")
          replace_if_present("client/src/components/cart/invoice-dialog.tsx", "{/* المطلوب دفعه نقداً */}", "{/* حالة وطريقة الدفع الفعلية */}")

          # Update test expectations tied to public copy. Payment-option tests that deliberately
          # assert the COD option itself are left untouched.
          test_generic_files = [
              "client/src/pages/__tests__/home.test.tsx",
              "client/src/pages/__tests__/trust-pages.test.tsx",
              "client/src/components/__tests__/footer.test.tsx",
              "client/src/pages/__tests__/privacy-policy.test.tsx",
              "client/src/pages/__tests__/product-details.test.tsx",
          ]
          for path in test_generic_files:
              if Path(path).exists():
                  text = read(path)
                  original = text
                  text = text.replace("الدفع نقداً عند الاستلام فقط", "الدفع عند الاستلام أو إلكترونياً")
                  text = text.replace("الدفع عند الاستلام فقط", "الدفع عند الاستلام أو إلكترونياً")
                  text = text.replace("نقداً عند الاستلام فقط", "عند الاستلام أو إلكترونياً")
                  text = text.replace("ماكو دفع إلكتروني مفعّل هسه", "الدفع الإلكتروني متاح")
                  if text != original:
                      write(path, text)

          # Public-surface regression guard: exclusive legacy claims are no longer allowed.
          public_surface_files = [
              "client/src/components/cart/checkout/order-summary.tsx",
              "client/src/pages/faq.tsx",
              "client/src/pages/shipping.tsx",
              "client/src/pages/terms.tsx",
              "client/src/pages/privacy-policy.tsx",
              "client/src/components/footer.tsx",
              "client/src/pages/home.tsx",
              "client/src/pages/why-aquavo.tsx",
              "client/src/pages/products.tsx",
              "client/src/pages/product-details.tsx",
              "client/src/components/navbar.tsx",
              "client/src/components/seo/meta-tags.tsx",
              "client/src/lib/site-search.ts",
              "api/ssr-meta.ts",
              "server/ssr-meta.ts",
              "api/_seo-content.ts",
              "api/_seo-preview-shell.tsx",
              "api/_ssr-preview-source.ts",
              "api/_guides-content.ts",
              "server/services/gemini-ai.ts",
          ]
          forbidden = [
              "الدفع عند الاستلام فقط",
              "الدفع نقداً عند الاستلام فقط",
              "ماكو دفع إلكتروني مفعّل",
              "لا يوجد دفع إلكتروني مفعّل",
              "ما نستخدم معالج دفع إلكتروني حالياً",
          ]
          failures = []
          for path in public_surface_files:
              text = read(path)
              for phrase in forbidden:
                  if phrase in text:
                      failures.append(f"{path}: {phrase}")
          if failures:
              raise SystemExit("stale payment claims remain:\n" + "\n".join(failures))

          print("Changed files:")
          for path in sorted(changed):
              print(" -", path)
          PY

      - name: TypeScript payment-flow check
        run: |
          npx tsc --noEmit --pretty false 2>&1 | tee /tmp/tsc.log || true
          if grep -E 'order-confirmation|invoice-dialog|profile-orders|server/routes/orders|order-summary|faq|shipping|privacy-policy|why-aquavo|footer|home|product-details|products|seo-contract|gemini-ai' /tmp/tsc.log; then
            echo "TypeScript errors found in payment-audit files"
            exit 1
          fi

      - name: Commit audit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src server api shared
          git commit -m "fix: align storefront with online payments"
          git push origin HEAD:codex/payment-copy-audit
