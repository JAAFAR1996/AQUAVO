          replace_required(
              "client/src/pages/terms.tsx",
              'description="شروط الطلب والدفع نقداً عند الاستلام والتوصيل والضمان المحدود لدى AQUAVO / محل المنبع."',
              'description="شروط الطلب والدفع عند الاستلام أو إلكترونياً والتوصيل والضمان المحدود لدى AQUAVO / محل المنبع."',
              1,
          )
          replace_required("client/src/pages/terms.tsx", "آخر تحديث: 24 أبريل 2026", "آخر تحديث: 25 آب 2026", 1)

          # SEO and searchable public copy. These files describe general store capabilities,
          # not the COD-specific transaction path, so generic modernization is safe here.
          generic_files = [
              "client/src/components/seo/meta-tags.tsx",
              "client/src/lib/site-search.ts",
              "client/src/pages/guides-new-aquarium-setup.tsx",
