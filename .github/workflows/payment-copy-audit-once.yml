              '{ icon: Banknote, title: "دفع مرن", text: "عند الاستلام أو إلكترونياً من صفحة إكمال الطلب." },',
              1,
          )
          replace_required(
              "client/src/pages/why-aquavo.tsx",
              'description="AQUAVO براند عراقي لمعدات الأحواض البريميوم: معلومات واضحة، توصيل لكل العراق، دفع عند الاستلام، ودعم 24/7."',
              'description="AQUAVO براند عراقي لمعدات الأحواض البريميوم: معلومات واضحة، توصيل لكل العراق، دفع عند الاستلام أو إلكترونياً، ودعم 24/7."',
              1,
          )

          replace_required(
              "client/src/pages/privacy-policy.tsx",
              'text: "نجمع المعلومات اللي تدخلها حتى ننفذ طلبك أو ندير حسابك: الاسم، رقم الهاتف، البريد إذا قدمته، عنوان التوصيل، ومحتوى الطلب. الدفع نقداً عند الاستلام فقط، لذلك ما نخزن بيانات بطاقة دفع.",',
              'text: "نجمع المعلومات اللي تدخلها حتى ننفذ طلبك أو ندير حسابك: الاسم، رقم الهاتف، البريد إذا قدمته، عنوان التوصيل، ومحتوى الطلب. إذا اخترت الدفع الإلكتروني، بيانات البطاقة تُدخل مباشرة لدى بوابة الدفع؛ AQUAVO ما يخزن رقم البطاقة أو بياناتها الحساسة.",',
              1,
