name: Finance packaging correction

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: finance-packaging-correction
  cancel-in-progress: true

env:
  BASE_SHA: 577de21ecf9bf537fc9c933d53a353d593caa6d5

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/finance-packaging-onboarding-20260802

      - name: Prepare one-shot patch script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-finance-packaging-fix.mjs')
          source = path.read_text(encoding='utf-8')
          needle = 'import { readFileSync, writeFileSync } from "node:fs";\n'
          prelude = '''import { readFileSync, writeFileSync } from "node:fs";
          const BASE = "${BASE}";
          const carton = {
            internalLengthCm: "${carton.internalLengthCm}",
            internalWidthCm: "${carton.internalWidthCm}",
            internalHeightCm: "${carton.internalHeightCm}",
          };
          '''
          if source.count(needle) != 1:
              raise SystemExit('patch prelude insertion point not unique')
          path.write_text(source.replace(needle, prelude, 1), encoding='utf-8')
          PY

      - name: Apply scoped code changes
        run: |
          node .github/scripts/apply-finance-packaging-fix.mjs
          node .github/scripts/align-packaging-contract-tests.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run check

      - name: Server checks
        run: pnpm run check:server

      - name: Accounting checks
        run: pnpm run check:accounting

      - name: Accounting route checks
        run: pnpm run check:accounting:routes

      - name: Migration checks
        run: pnpm run check:migrations

      - name: Packaging focused tests
        run: >-
          pnpm exec vitest run
          server/__tests__/carton-onboarding-service.test.ts
          server/__tests__/carton-onboarding-route.test.ts
          server/__tests__/packing-data-summary.test.ts
          server/__tests__/packing-import.test.ts
          client/src/pages/__tests__/finance-route-contract.test.ts
          client/src/components/admin/packaging/__tests__/packing-import-preview.test.tsx
          client/src/components/admin/packaging/__tests__/packaging-ui.test.tsx
          client/src/components/admin/packaging/__tests__/packaging-section.test.tsx

      - name: Run candidate full suite
        shell: bash
        run: |
          set +e
          pnpm exec vitest run --reporter=json --outputFile=/tmp/candidate-vitest.json
          code=$?
          echo "$code" > /tmp/candidate-exit.txt
          exit 0

      - name: Compare with verified main baseline
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const report = JSON.parse(fs.readFileSync('/tmp/candidate-vitest.json', 'utf8'));
          const root = process.env.GITHUB_WORKSPACE.replaceAll('\\', '/').replace(/\/$/, '');
          const failures = new Set();
          for (const suite of report.testResults ?? []) {
            let file = String(suite.name ?? 'unknown-file').replaceAll('\\', '/');
            if (file.startsWith(root + '/')) file = file.slice(root.length + 1);
            else file = path.basename(file);
            let assertionFailure = false;
            for (const assertion of suite.assertionResults ?? []) {
              if (assertion.status === 'failed') {
                assertionFailure = true;
                failures.add(`${file} :: ${assertion.fullName ?? assertion.title ?? 'unnamed test'}`);
              }
            }
            if (suite.status === 'failed' && !assertionFailure) failures.add(`${file} :: FILE_LOAD_OR_HOOK_FAILURE`);
          }
          const candidateFailures = [...failures].sort();
          const baselineFailures = [
            'client/src/components/__tests__/navbar.test.tsx :: Navbar Component shows the focused primary navigation',
            'client/src/components/products/__tests__/filter-bar.test.tsx :: FilterBar mobile touch targets (WCAG 2.5.8 target size, min 44px) keeps every quick-filter chip at >=44px min-height at tablet width too',
            'client/src/components/products/__tests__/filter-bar.test.tsx :: FilterBar mobile touch targets (WCAG 2.5.8 target size, min 44px) keeps the trigger buttons at >=44px min-height at tablet width too (md:min-h-11 counters the shared Button size default shrinking to md:min-h-9)',
            'client/src/components/products/__tests__/multi-dimension-variant-selector.test.tsx :: MultiDimensionVariantSelector disables a combination that has no matching in-stock variant',
            'client/src/components/products/__tests__/multi-dimension-variant-selector.test.tsx :: MultiDimensionVariantSelector renders a labeled group per dimension',
            'client/src/pages/__tests__/checkout.test.tsx :: checkout page completes the closed-circuit success path with a mocked server response',
            'client/src/pages/__tests__/checkout.test.tsx :: checkout page disables the confirm button and blocks a second click while the order request is in flight',
            'client/src/pages/__tests__/checkout.test.tsx :: checkout page sends the applied coupon code with order creation so checkout-displayed and order-created totals stay consistent',
            'client/src/pages/__tests__/journey.test.tsx :: JourneyPage renders loading state when loading saved plan',
            'client/src/pages/__tests__/order-confirmation-ux.test.tsx :: Order confirmation — inherits the global theme (no hard-coded dark) keeps RTL and the intentional WhatsApp green CTA',
            'server/__tests__/ssr-handler-status.test.ts :: FILE_LOAD_OR_HOOK_FAILURE',
            'server/__tests__/ssr-hero-preload.test.ts :: FILE_LOAD_OR_HOOK_FAILURE',
            'server/__tests__/ssr-pdp-preload.test.ts :: FILE_LOAD_OR_HOOK_FAILURE',
            'server/__tests__/ssr-seo-contract.test.ts :: FILE_LOAD_OR_HOOK_FAILURE',
          ].sort();
          const baselineSet = new Set(baselineFailures);
          const candidateSet = new Set(candidateFailures);
          const newFailures = candidateFailures.filter((failure) => !baselineSet.has(failure));
          const resolvedFailures = baselineFailures.filter((failure) => !candidateSet.has(failure));
          const summary = {
            baseSha: process.env.BASE_SHA,
            baselineRunId: 30734456338,
            candidate: {
              exitCode: Number(fs.readFileSync('/tmp/candidate-exit.txt', 'utf8').trim()),
              suitesTotal: report.numTotalTestSuites,
              suitesFailed: report.numFailedTestSuites,
              testsTotal: report.numTotalTests,
              testsFailed: report.numFailedTests,
              failures: candidateFailures,
            },
            baseline: {
              exitCode: 1,
              suitesTotal: 804,
              suitesFailed: 16,
              testsTotal: 2332,
              testsFailed: 10,
              failures: baselineFailures,
            },
            newFailures,
            resolvedFailures,
          };
          fs.writeFileSync('/tmp/full-suite-comparison.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          if (newFailures.length > 0) process.exit(1);
          NODE

      - name: Upload exact full-suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-packaging-full-suite-${{ github.run_id }}
          path: |
            /tmp/candidate-vitest.json
            /tmp/candidate-exit.txt
            /tmp/full-suite-comparison.json
          if-no-files-found: warn
          retention-days: 14

      - name: Production build
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Diff whitespace check
        run: git diff --check

      - name: Commit verified correction
        run: |
          rm -f .github/scripts/apply-finance-packaging-fix.mjs
          rm -f .github/scripts/align-packaging-contract-tests.mjs
          rm -f .github/workflows/finance-packaging-fix.yml
          git config user.name "AQUAVO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(finance): unify finance and carton onboarding"
          git push origin HEAD:fix/finance-packaging-onboarding-20260802
