name: QR asset path repair (one-time)

on:
  push:
    branches:
      - fix/qr-hero-art-directed-20260813

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qr-hero-art-directed-20260813
          fetch-depth: 0

      - name: Make QR asset URLs absolute to /qr
        shell: python
        run: |
          from pathlib import Path
          p = Path('client/public/qr/index.html')
          s = p.read_text(encoding='utf-8')
          sentinel = '__AQUAVO_QR_ASSET_SENTINEL__'
          s = s.replace('/qr/assets/', sentinel)
          s = s.replace('assets/', '/qr/assets/')
          s = s.replace(sentinel, '/qr/assets/')
          if 'rel="canonical"' not in s:
              needle = '  <meta property="og:description"'
              s = s.replace(needle, '  <link rel="canonical" href="https://www.aquavoiq.com/qr">\n' + needle, 1)
          p.write_text(s, encoding='utf-8', newline='\n')

      - name: Remove one-time workflow
        run: rm .github/workflows/qr-asset-path-fix-once.yml

      - name: Commit repaired QR page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/qr/index.html .github/workflows/qr-asset-path-fix-once.yml
          git commit -m "fix: resolve QR assets under /qr"
          git push origin HEAD:fix/qr-hero-art-directed-20260813
