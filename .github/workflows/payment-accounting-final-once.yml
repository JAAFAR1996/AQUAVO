name: Payment accounting final audit (one-time)

on:
  push:
    branches:
      - codex/payment-copy-audit

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --prefer-offline

      - name: Finish stale payment surfaces
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {found}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_required(
              "client/src/pages/checkout.tsx",
              "<span>الدفع عند الاستلام</span>",
              "<span>الدفع عند الاستلام أو إلكترونياً</span>",
          )
          replace_required(
              "e2e/extended-features.spec.ts",
              "page.locator('text=/الدفع|Payment|زين كاش|كاش/i')",
              "page.locator('text=/الدفع الإلكتروني|الدفع عند الاستلام|Online Payment|Al-Qaseh|Payment/i')",
          )
          replace_required(
              "PRODUCT_SPECIFICATION.md",
              "**Payment Methods**:\n- Cash on Delivery\n- Credit Card\n- ZainCash (local payment)",
              "**Payment Methods**:\n- Cash on Delivery\n- Online payment through the Al-Qaseh hosted checkout (AQUAVO does not collect or store card details)",
          )
          replace_required(
              "shared/schema.ts",
              "method: text(\"method\").notNull(), // cache_on_delivery, credit_card, zain_cash",
              "method: text(\"method\").notNull(), // cod/cash_on_delivery (legacy) or alqaseh (online hosted checkout)",
          )

          active_checks = {
              "client/src/pages/checkout.tsx": ["<span>الدفع عند الاستلام</span>"],
              "e2e/extended-features.spec.ts": ["زين كاش", "ZainCash"],
              "e2e/checkout.spec.ts": ["ZainCash", "creditCardOption", "zainCashOption"],
              "e2e/pages/checkout.page.ts": ["ZainCash", "creditCardOption", "zainCashOption", "cardCVVInput"],
              "PRODUCT_SPECIFICATION.md": ["- Credit Card", "- ZainCash"],
          }
          failures = []
          for path, forbidden in active_checks.items():
              text = Path(path).read_text(encoding="utf-8")
              for phrase in forbidden:
                  if phrase in text:
                      failures.append(f"{path}: {phrase}")
          if failures:
              raise SystemExit("stale payment surface remains:\n" + "\n".join(failures))
          PY

      - name: Relevant tests
        run: |
          pnpm exec vitest run \
            server/__tests__/alqaseh-payment-flow.test.ts \
            server/__tests__/alqaseh-accounting-contract.test.ts \
            client/src/pages/__tests__/checkout.test.tsx \
            client/src/pages/__tests__/privacy-policy.test.tsx \
            client/src/pages/__tests__/trust-pages.test.tsx \
            client/src/components/__tests__/footer.test.tsx \
            --reporter=dot

      - name: TypeScript check for payment-audit files
        shell: bash
        run: |
          pnpm run check 2>&1 | tee /tmp/tsc.log || true
          if grep -E 'alqaseh-accounting-contract|client/src/pages/checkout\.tsx|e2e/extended-features\.spec\.ts|shared/schema\.ts' /tmp/tsc.log; then
            echo "TypeScript errors found in final payment-audit files"
            exit 1
          fi

      - name: Commit final audit and remove workflow
        shell: bash
        run: |
          rm .github/workflows/payment-accounting-final-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: finish online payment project audit"
          git push
