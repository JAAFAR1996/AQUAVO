name: Temporary unpaid-order cancellation patch runner

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch-cancel-flow:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/admin-cancel-unpaid-orders'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply reviewed patch
        run: python scripts/apply-admin-cancel-unpaid-orders.py

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-admin-cancel-unpaid-orders.py .github/workflows/apply-admin-cancel-unpaid-orders.yml
          git add client/src/components/admin/orders-management.tsx server/routes/admin-orders-v2.ts server/services/alqaseh-order-payment.ts server/services/__tests__/alqaseh-admin-cancellation-contract.test.ts
          git commit -m "feat: safely cancel unpaid Al-Qaseh orders"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
