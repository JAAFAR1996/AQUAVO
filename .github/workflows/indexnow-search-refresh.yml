name: IndexNow Search Refresh

# Fires when Vercel reports a successful *production* deployment, not on push.
#
# The push trigger was the reason this job kept notifying IndexNow about a
# state that was not live yet: it started the moment main moved, and its
# readiness probe only checked that sitemap-recovery.xml still contained a
# product that had been there for weeks, so it always passed instantly and
# submitted against the previous deployment. deployment_status is the event
# that actually means "the new build is serving".
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      window_days:
        description: "Only submit URLs whose sitemap lastmod is within this many days"
        required: false
        default: "7"
      dry_run:
        description: "Set to 1 to log the selection without calling IndexNow"
        required: false
        default: "0"

concurrency:
  group: indexnow-production-refresh
  cancel-in-progress: false

jobs:
  submit:
    name: Submit changed AQUAVO URLs
    # deployment_status fires for preview deployments too, and for every state
    # transition. Only a successful production deployment should notify search
    # engines, and a preview URL must never be submitted.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Reading previous runs and their artifacts to recover the ledger.
      actions: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      # What has already been submitted, and for which lastmod.
      #
      # This was an actions/cache entry and it silently never persisted: the
      # cache refuses to save from a deployment_status event — "not tied to a
      # branch or tag ref" — so every run started from an empty ledger and
      # resubmitted the same URLs the previous deployment had just sent. The
      # recency window kept that bounded, but the second brake was inert.
      # Artifacts are scoped to the run rather than a ref, so they survive.
      - name: Restore the ledger from the last run that wrote one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for id in $(gh run list --workflow=indexnow-search-refresh.yml                         --status=success --limit 20                         --json databaseId -q '.[].databaseId'); do
            if gh api "repos/$REPO/actions/runs/$id/artifacts"                  -q '.artifacts[].name' 2>/dev/null | grep -qx indexnow-ledger; then
              gh run download "$id" --name indexnow-ledger --dir . && break || true
            fi
          done
          if [ -f .indexnow-ledger.json ]; then
            echo "Ledger restored with $(node -e "console.log(Object.keys(require('./.indexnow-ledger.json')).length)") URL(s)."
          else
            echo "No previous ledger; the recency window bounds this run."
          fi

      - name: Submit changed URLs to IndexNow
        env:
          INDEXNOW_WINDOW_DAYS: ${{ github.event.inputs.window_days || '7' }}
          INDEXNOW_DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: node TOOLS/submit-indexnow.mjs

      # Written only when the submission succeeded, so a failed or rate-limited
      # run leaves the previous ledger standing and the next run retries.
      - name: Persist the ledger for the next run
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-ledger
          path: .indexnow-ledger.json
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true
