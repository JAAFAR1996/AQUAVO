name: WhatsApp Test Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wa-test-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect test outbox before worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          psql "$DATABASE_URL" -AtF '|' -c "
            SELECT
              o.order_number,
              o.status,
              o.is_test,
              COALESCE(j.status,'NO_JOB'),
              COALESCE(j.attempt_count,0),
              CASE WHEN j.provider_message_id IS NULL THEN 'NO_WAMID' ELSE 'HAS_WAMID' END,
              COALESCE(j.provider_status,'NO_PROVIDER_STATUS'),
              COALESCE(j.last_error_code,'NO_ERROR'),
              CASE WHEN j.due_at IS NULL THEN 'NO_DUE' WHEN j.due_at <= clock_timestamp() THEN 'DUE' ELSE 'NOT_DUE' END
            FROM public.orders o
            LEFT JOIN public.customer_message_jobs j
              ON j.order_id=o.id AND j.job_type='delivery_care'
            WHERE o.order_number='TEST-15371D3314'
            LIMIT 1;
          "

      - name: Run customer messaging worker once
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --max-time 25 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.aquavoiq.com/api/cron/customer-messaging"
          echo

      - name: Inspect test outbox after worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -AtF '|' -c "
            SELECT
              o.order_number,
              o.status,
              o.is_test,
              COALESCE(j.status,'NO_JOB'),
              COALESCE(j.attempt_count,0),
              CASE WHEN j.provider_message_id IS NULL THEN 'NO_WAMID' ELSE 'HAS_WAMID' END,
              COALESCE(j.provider_status,'NO_PROVIDER_STATUS'),
              COALESCE(j.last_error_code,'NO_ERROR'),
              CASE WHEN j.due_at IS NULL THEN 'NO_DUE' WHEN j.due_at <= clock_timestamp() THEN 'DUE' ELSE 'NOT_DUE' END
            FROM public.orders o
            LEFT JOIN public.customer_message_jobs j
              ON j.order_id=o.id AND j.job_type='delivery_care'
            WHERE o.order_number='TEST-15371D3314'
            LIMIT 1;
          "
