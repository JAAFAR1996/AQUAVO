name: One-off kg quantity label patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-off-kg-quantity-label.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch product quantity unit
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('client/src/pages/product-details.tsx')
          text = path.read_text(encoding='utf-8')

          marker = '  const inStock = displayStock > 0;\n'
          addition = '''  const inStock = displayStock > 0;\n  const isKilogramProduct =\n    product.name.includes("كغم") ||\n    product.name.includes("كيلو") ||\n    ["رمال", "أحجار", "حصى"].includes(product.subcategory) ||\n    ["houyi-activated-carbon", "houyi-ceramic-ring", "houyi-breathing-ring-white"].includes(product.slug);\n'''

          old_label = '<span className="text-sm font-medium" id="quantity-label">الكمية:</span>'
          new_label = '<span className="text-sm font-medium" id="quantity-label">الكمية:{isKilogramProduct ? " كيلو" : ""}</span>'

          if 'const isKilogramProduct =' not in text:
              if marker not in text:
                  raise SystemExit('Could not find inStock marker')
              text = text.replace(marker, addition, 1)

          if new_label not in text:
              if old_label not in text:
                  raise SystemExit('Could not find quantity label')
              text = text.replace(old_label, new_label, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove one-off workflow
        shell: bash
        run: |
          git config user.name "AQUAVO Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-off-kg-quantity-label.yml
          git add client/src/pages/product-details.tsx
          git commit -m "feat: show kilo beside quantity for kg products"
          git push origin HEAD:main
