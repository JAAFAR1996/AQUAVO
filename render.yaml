# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Adopt existing service srv-dbup1i1srm7s73figmeg in workspace tea-d10bk5q4d50c73akpcmg.
# Create the Blueprint with existingResources: adopt and autoSync: false.
# Verify the planned service ID before applying; no replacement service is intended.
# Existing environment variables are deliberately omitted and retained by Render.
# The custom-domain declaration does not change authoritative Cloudflare DNS.
previews:
  generation: 'off'

services:
  - type: web
    name: aquavo-store-recovery-preview
    runtime: node
    repo: https://github.com/JAAFAR1996/AQUAVO
    branch: recovery/render-20261118
    rootDir: ""
    region: frankfurt
    plan: free
    numInstances: 1
    buildCommand: corepack enable && corepack prepare pnpm@10.0.0 --activate && pnpm install --frozen-lockfile --prod=false && pnpm run build
    startCommand: node dist/index.js
    autoDeployTrigger: 'off'
    renderSubdomainPolicy: enabled
    healthCheckPath: /health
    domains:
      - www.aquavoiq.com
